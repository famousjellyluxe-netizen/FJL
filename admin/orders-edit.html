<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Order Status - FJL Admin Panel</title>
    <link rel="icon" type="image/svg+xml" href="/fjl-logo-favicon.svg">

    <!-- Design System -->
    <link rel="stylesheet" href="design-tokens.css">
    <link rel="stylesheet" href="styles.css">

    <!-- Fonts & Icons -->
    <script src="https://unpkg.com/lucide@1.263.1"></script>
    <script src="../notifications.js"></script>

    <style>
        /* Status Badge Colors */
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-pending { background: #fef3c7; color: #92400e; }
        .status-paid { background: #dcfce7; color: #166534; }
        .status-completed { background: #d1fae5; color: #065f46; }
        .status-failed { background: #fee2e2; color: #7f1d1d; }
        .status-pending-shipment { background: #fef3c7; color: #92400e; }
        .status-shipped { background: #bfdbfe; color: #1e40af; }
        .status-delivered { background: #d1fae5; color: #065f46; }
        .status-returned { background: #e0e7ff; color: #3730a3; }

        /* Status Select Styling */
        .status-select {
            padding: var(--spacing-md) var(--spacing-lg);
            border: 2px solid var(--color-border);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-family: var(--font-body);
            background: var(--color-secondary);
            color: var(--color-primary);
            cursor: pointer;
            transition: all var(--transition);
        }

        .status-select:hover {
            border-color: var(--color-accent);
        }

        .status-select:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px rgba(224, 159, 62, 0.1);
        }

        /* Status Grid */
        .status-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--spacing-2xl);
            margin-bottom: var(--spacing-3xl);
        }

        @media (min-width: 768px) {
            .status-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .status-section {
            padding: var(--spacing-lg);
            background: var(--color-light-gray);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
        }

        .status-section h4 {
            margin: 0 0 var(--spacing-md) 0;
            color: var(--color-primary);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .current-status {
            margin-bottom: var(--spacing-lg);
            padding: var(--spacing-md);
            background: var(--color-secondary);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .current-status span:first-child {
            font-size: 12px;
            color: var(--color-gray);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .current-status .status-badge {
            margin: 0;
        }

        /* Sticky Save Button */
        .order-actions {
            position: sticky;
            bottom: 0;
            background: var(--color-secondary);
            border-top: 1px solid var(--color-border);
            padding: var(--spacing-lg) var(--spacing-xl);
            display: flex;
            gap: var(--spacing-md);
            z-index: 100;
        }

        .order-actions button {
            flex: 1;
            min-height: 44px;
        }

        /* Loading State */
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Mobile Optimizations */
        @media (max-width: 767px) {
            .admin-content {
                padding: var(--spacing-lg);
            }

            .status-section {
                padding: var(--spacing-lg);
            }

            .status-select {
                width: 100%;
                min-height: 44px;
            }

            .order-actions {
                flex-direction: column;
            }

            .order-actions button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-logo-container">
                <div class="sidebar-logo-wrapper">
                    <div class="sidebar-logo-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="3" width="8" height="8" fill="currentColor"/>
                            <rect x="13" y="3" width="8" height="8" fill="currentColor" opacity="0.6"/>
                            <rect x="3" y="13" width="8" height="8" fill="currentColor" opacity="0.6"/>
                            <rect x="13" y="13" width="8" height="8" fill="currentColor" opacity="0.3"/>
                        </svg>
                    </div>
                    <div class="sidebar-logo-text">
                        <span class="main">FJL</span>
                        <span class="tagline">Admin</span>
                    </div>
                </div>
                <button class="sidebar-close-btn" id="sidebarCloseBtn" type="button" title="Close menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <ul class="sidebar-menu">
                <li class="sidebar-menu-item"><a href="dashboard.html" class="sidebar-menu-link"><i data-lucide="bar-chart-3" class="icon-sm icon-gap"></i>Dashboard</a></li>
                <li class="sidebar-menu-item"><a href="products.html" class="sidebar-menu-link"><i data-lucide="package" class="icon-sm icon-gap"></i>Products</a></li>
                <li class="sidebar-menu-item"><a href="categories.html" class="sidebar-menu-link"><i data-lucide="tag" class="icon-sm icon-gap"></i>Categories</a></li>
                <li class="sidebar-menu-item"><a href="product-announcements.html" class="sidebar-menu-link"><i data-lucide="megaphone" class="icon-sm icon-gap"></i>Announcements</a></li>
                <li class="sidebar-menu-item"><a href="orders.html" class="sidebar-menu-link active"><i data-lucide="shopping-cart" class="icon-sm icon-gap"></i>Orders</a></li>
                <li class="sidebar-menu-item"><a href="customers.html" class="sidebar-menu-link"><i data-lucide="users" class="icon-sm icon-gap"></i>Customers</a></li>
                <li class="sidebar-menu-item"><a href="analytics.html" class="sidebar-menu-link"><i data-lucide="trending-up" class="icon-sm icon-gap"></i>Analytics</a></li>
                <li class="sidebar-menu-item"><a href="settings.html" class="sidebar-menu-link"><i data-lucide="settings" class="icon-sm icon-gap"></i>Settings</a></li>
            </ul>
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="sidebar-avatar">A</div>
                    <div><div class="label-text">Logged in as</div><div style="font-weight: 600;" id="adminName">Admin</div></div>
                </div>
                <button class="btn btn-secondary btn-sm btn-block" id="logoutBtn">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <!-- Header -->
            <header class="admin-header">
                <div class="header-right">
                    <button class="header-icon-btn" id="closeEditOrderBtn" title="Close">×</button>
                </div>
            </header>

            <!-- Content -->
            <div class="admin-content">
                <div id="orderHeader" style="margin-bottom: var(--spacing-2xl);">
                    <!-- Order info will be loaded here -->
                </div>

                <div class="card">
                    <div class="card-body">
                        <form id="statusForm">
                            <div class="status-grid">
                                <!-- Payment Status Section -->
                                <div class="status-section">
                                    <h4>Payment Status</h4>
                                    <div class="current-status">
                                        <span>Current:</span>
                                        <span id="currentPaymentStatus" class="status-badge status-pending">Pending</span>
                                    </div>
                                    <label class="form-label">Update Payment Status</label>
                                    <select id="paymentStatus" class="status-select form-control" required>
                                        <option value="pending">Pending</option>
                                        <option value="verified">Verified</option>
                                        <option value="failed">Failed</option>
                                    </select>
                                </div>

                                <!-- Order Status Section -->
                                <div class="status-section">
                                    <h4>Order Status</h4>
                                    <div class="current-status">
                                        <span>Current:</span>
                                        <span id="currentOrderStatus" class="status-badge status-pending">Pending</span>
                                    </div>
                                    <label class="form-label">Update Order Status</label>
                                    <select id="orderStatus" class="status-select form-control" required>
                                        <option value="pending">Pending</option>
                                        <option value="shipped">Shipped</option>
                                        <option value="delivered">Delivered</option>
                                        <option value="cancelled">Cancelled</option>
                                    </select>
                                </div>

                            </div>

                            <!-- Form Actions -->
                            <div class="order-actions">
                                <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                                <button type="submit" class="btn btn-primary" id="saveBtn"><i data-lucide="check" class="icon-sm"></i> Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api-service.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/icon.js"></script>
    <script src="admin.js"></script>
    <script src="js/responsive.js"></script>
    <script>
        let currentOrderId = null;
        let currentOrder = null;

        if (!checkAdminAuth()) {
            window.location.href = '/admin/index.html';
        } else {
            initializeEditOrder();
        }

        async function initializeEditOrder() {
            const adminInfo = adminDataService.getAdminInfo();
            if (adminInfo && adminInfo.email) {
                document.getElementById('adminName').textContent = adminInfo.email.split('@')[0];
            }

            // Get order ID from URL query params
            const params = new URLSearchParams(window.location.search);
            currentOrderId = params.get('id');

            if (!currentOrderId) {
                notifications.error('No order ID provided');
                setTimeout(() => window.location.href = 'orders.html', 2000);
                return;
            }

            await loadOrder();
        }

        async function loadOrder() {
            try {
                console.log('Loading order with ID:', currentOrderId);

                // Try to get the order via API using the available service
                let orderData = null;

                // Try using window.apiServices first (if available)
                if (window.apiServices?.orderService?.getOrder) {
                    try {
                        orderData = await window.apiServices.orderService.getOrder(currentOrderId);
                        currentOrder = orderData.data || orderData;
                    } catch (apiError) {
                        console.log('API service error, trying direct fetch:', apiError);
                    }
                }

                // If service didn't work, try direct fetch
                if (!currentOrder) {
                    const token = sessionStorage.getItem('adminToken') || localStorage.getItem('adminToken');
                    const response = await fetch(`/api/orders/${currentOrderId}`, {
                        method: 'GET',
                        headers: {
                            'Authorization': token ? `Bearer ${token}` : undefined
                        }
                    });

                    if (!response.ok) {
                        throw new Error(`Failed to load order (Status: ${response.status})`);
                    }

                    const data = await response.json();
                    currentOrder = data.data || data;
                }

                console.log('Order loaded:', currentOrder);

                // Display order header info
                displayOrderHeader();

                // Load current statuses
                loadCurrentStatuses();

            } catch (error) {
                console.error('Error loading order:', error);
                // Don't show error for missing order data - form still works with defaults
                console.log('Proceeding with default status values');
                // Still initialize the form with default values
                loadCurrentStatuses();
            }
        }

        function displayOrderHeader() {
            const header = document.getElementById('orderHeader');
            const orderDate = new Date(currentOrder.created_at || currentOrder.order_date).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });

            header.innerHTML = `
                <div style="background: var(--color-secondary); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--spacing-lg);">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-xl); margin-bottom: var(--spacing-lg);">
                        <div>
                            <span style="color: var(--color-gray); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Order ID</span>
                            <p style="margin: 4px 0 0 0; font-size: 18px; font-weight: 600; color: var(--color-primary);">
                                ${currentOrder.id || 'N/A'}
                            </p>
                        </div>
                        <div>
                            <span style="color: var(--color-gray); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Order Date</span>
                            <p style="margin: 4px 0 0 0; font-size: 18px; font-weight: 600; color: var(--color-primary);">
                                ${orderDate}
                            </p>
                        </div>
                        <div>
                            <span style="color: var(--color-gray); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Customer</span>
                            <p style="margin: 4px 0 0 0; font-size: 16px; font-weight: 500; color: var(--color-primary);">
                                ${currentOrder.buyer_name || currentOrder.customer_name || 'Unknown'}
                            </p>
                        </div>
                        <div>
                            <span style="color: var(--color-gray); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Total Amount</span>
                            <p style="margin: 4px 0 0 0; font-size: 18px; font-weight: 600; color: var(--color-primary);">
                                $${(currentOrder.total_amount || currentOrder.total || 0).toFixed(2)}
                            </p>
                        </div>
                    </div>
                </div>
            `;
        }

        function loadCurrentStatuses() {
            // Map status values to form fields
            const paymentStatus = currentOrder.payment_status || 'pending';
            const orderStatus = currentOrder.order_status || 'pending';

            // Set form values
            document.getElementById('paymentStatus').value = paymentStatus;
            document.getElementById('orderStatus').value = orderStatus;

            // Display current status badges
            updateStatusBadges(paymentStatus, orderStatus);
        }

        function updateStatusBadges(payment, order) {
            const statusClasses = {
                'pending': 'status-pending',
                'verified': 'status-paid',
                'failed': 'status-failed',
                'shipped': 'status-shipped',
                'delivered': 'status-delivered',
                'cancelled': 'status-pending'
            };

            const badgeClass = (status) => statusClasses[status] || 'status-pending';
            const formatStatus = (status) => status.replace(/_/g, ' ').toUpperCase();

            document.getElementById('currentPaymentStatus').textContent = formatStatus(payment);
            document.getElementById('currentPaymentStatus').className = `status-badge ${badgeClass(payment)}`;

            document.getElementById('currentOrderStatus').textContent = formatStatus(order);
            document.getElementById('currentOrderStatus').className = `status-badge ${badgeClass(order)}`;
        }

        async function saveStatuses(event) {
            event.preventDefault();

            const saveBtn = document.getElementById('saveBtn');
            const originalText = saveBtn.innerHTML;
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<span class="loading-spinner"></span> Saving...';

            try {
                const paymentStatusValue = document.getElementById('paymentStatus').value;
                const orderStatusValue = document.getElementById('orderStatus').value;
                const token = localStorage.getItem('adminToken') || localStorage.getItem('fjl_admin_token') || sessionStorage.getItem('adminToken');

                console.log('Updating payment status to:', paymentStatusValue);
                console.log('Updating order status to:', orderStatusValue);
                console.log('Current Order ID:', currentOrderId);
                console.log('Token exists:', !!token);

                const apiBaseUrl = window.location.origin.includes('localhost')
                    ? 'http://localhost:5001/api'
                    : '/api';
                const paymentUrl = `${apiBaseUrl}/orders/${currentOrderId}/payment-status`;
                console.log('Making PUT request to:', paymentUrl);

                // Update payment status via dedicated endpoint
                const paymentResponse = await fetch(paymentUrl, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ payment_status: paymentStatusValue })
                });

                console.log('Payment response status:', paymentResponse.status);
                console.log('Payment response ok:', paymentResponse.ok);
                console.log('Payment response headers:', paymentResponse.headers.get('content-type'));

                if (!paymentResponse.ok) {
                    const contentType = paymentResponse.headers.get('content-type');
                    let errorMessage = 'Failed to update payment status';
                    let responseBody = '';

                    try {
                        if (contentType && contentType.includes('application/json')) {
                            const errorData = await paymentResponse.json();
                            responseBody = JSON.stringify(errorData);
                            errorMessage = errorData.error || errorData.message || errorMessage;
                        } else {
                            responseBody = await paymentResponse.text();
                            errorMessage = responseBody || `HTTP ${paymentResponse.status}: ${paymentResponse.statusText}`;
                        }
                    } catch (parseError) {
                        errorMessage = `HTTP ${paymentResponse.status}: ${paymentResponse.statusText}`;
                    }
                    console.error('Payment response body:', responseBody);
                    throw new Error(`Payment status error: ${errorMessage}`);
                }

                // Parse successful response safely
                let paymentData = null;
                try {
                    const contentType = paymentResponse.headers.get('content-type');
                    if (contentType && contentType.includes('application/json')) {
                        paymentData = await paymentResponse.json();
                        console.log('Payment response data:', paymentData);
                    }
                } catch (parseError) {
                    console.warn('Could not parse payment response:', parseError);
                }

                // Update order status via dedicated endpoint
                const orderUrl = `${apiBaseUrl}/orders/${currentOrderId}/status`;
                console.log('Making PUT request to:', orderUrl);
                const orderResponse = await fetch(orderUrl, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ status: orderStatusValue })
                });

                console.log('Order response status:', orderResponse.status);
                console.log('Order response ok:', orderResponse.ok);
                console.log('Order response headers:', orderResponse.headers.get('content-type'));

                if (!orderResponse.ok) {
                    const contentType = orderResponse.headers.get('content-type');
                    let errorMessage = 'Failed to update order status';

                    try {
                        if (contentType && contentType.includes('application/json')) {
                            const errorData = await orderResponse.json();
                            errorMessage = errorData.error || errorData.message || errorMessage;
                        } else {
                            const text = await orderResponse.text();
                            errorMessage = text || `HTTP ${orderResponse.status}: ${orderResponse.statusText}`;
                        }
                    } catch (parseError) {
                        errorMessage = `HTTP ${orderResponse.status}: ${orderResponse.statusText}`;
                    }
                    throw new Error(`Order status error: ${errorMessage}`);
                }

                // Parse successful response safely
                let orderData = null;
                try {
                    const contentType = orderResponse.headers.get('content-type');
                    if (contentType && contentType.includes('application/json')) {
                        orderData = await orderResponse.json();
                        console.log('Order response data:', orderData);
                    }
                } catch (parseError) {
                    console.warn('Could not parse order response:', parseError);
                }

                notifications.success('Order statuses updated successfully');

                // Update current order object
                currentOrder.payment_status = paymentStatusValue;
                currentOrder.order_status = orderStatusValue;

                // Show updated badges briefly
                updateStatusBadges(paymentStatusValue, orderStatusValue);

                setTimeout(() => window.location.href = 'orders.html', 1000);

            } catch (error) {
                console.error('Error saving order:', error);
                notifications.error('Error updating order: ' + error.message);
                saveBtn.disabled = false;
                saveBtn.innerHTML = originalText;
            }
        }

        function goBackToOrders() {
            window.location.href = 'orders.html';
        }
    </script>
    <script>
        // Close sidebar with close button
        document.addEventListener('DOMContentLoaded', () => {
            const sidebarCloseBtn = document.getElementById('sidebarCloseBtn');
            sidebarCloseBtn?.addEventListener('click', () => {
                const sidebar = document.querySelector('.admin-sidebar');
                if (sidebar) {
                    sidebar.classList.remove('open', 'active');
                }
            });

            // Set up logout button click handler
            const logoutBtn = document.getElementById('logoutBtn');
            logoutBtn?.addEventListener('click', (e) => {
                e.stopPropagation();
                logoutAdmin();
            });

            // Set up close button click handler
            const closeEditOrderBtn = document.getElementById('closeEditOrderBtn');
            closeEditOrderBtn?.addEventListener('click', (e) => {
                e.stopPropagation();
                goBackToOrders();
            });

            // Set up cancel button click handler
            const cancelBtn = document.getElementById('cancelBtn');
            cancelBtn?.addEventListener('click', (e) => {
                e.stopPropagation();
                goBackToOrders();
            });

            // Set up form submit handler
            const statusForm = document.getElementById('statusForm');
            statusForm?.addEventListener('submit', (e) => {
                saveStatuses(e);
            });

            initializeEditOrder();
        });
    </script>
</body>
</html>
