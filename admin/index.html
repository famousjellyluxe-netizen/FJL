<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Famous Jolly Luxe</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../notifications.js"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: var(--spacing-lg);
        }

        .login-card {
            background: var(--color-secondary);
            border-radius: var(--radius-lg);
            padding: var(--spacing-2xl);
            box-shadow: var(--shadow-lg);
        }

        .login-header {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
        }

        .login-logo {
            font-size: 48px;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: var(--spacing-md);
        }

        .login-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: var(--spacing-sm);
        }

        .login-subtitle {
            color: var(--color-gray);
            font-size: 14px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
        }

        .login-footer {
            text-align: center;
            color: var(--color-gray);
            font-size: 12px;
            margin-top: var(--spacing-lg);
        }

        .alert {
            margin-bottom: var(--spacing-lg);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            gap: var(--spacing-md);
        }

        .remember-forgot a {
            color: var(--color-accent);
            text-decoration: none;
        }

        .remember-forgot a:hover {
            text-decoration: underline;
        }

        .password-field-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-toggle-btn {
            position: absolute;
            right: var(--spacing-md);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--color-gray);
            padding: var(--spacing-sm);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-toggle-btn:hover {
            color: var(--color-accent);
        }

        .password-field-wrapper input {
            padding-right: 40px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">FJL</div>
                <h1 class="login-title">Admin Panel</h1>
                <p class="login-subtitle">Famous Jolly Luxe Management System</p>
            </div>

            <div id="alertContainer"></div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="password-field-wrapper">
                        <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                        <button type="button" class="password-toggle-btn" id="passwordToggle" title="Show/hide password">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>

                <div class="remember-forgot">
                    <label style="display: flex; align-items: center; gap: var(--spacing-sm); cursor: pointer;">
                        <input type="checkbox" id="remember" checked>
                        <span>Remember me</span>
                    </label>
                    <a href="#" onclick="notifications.info('Password reset functionality coming soon!'); return false;">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Sign In</button>
            </form>

            <div class="login-footer">
                <p>For security, only authorized administrators can access this panel.</p>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const alertContainer = document.getElementById('alertContainer');
        const passwordField = document.getElementById('password');
        const passwordToggle = document.getElementById('passwordToggle');

        // Check if already logged in
        if (adminDataService.isAdminAuthenticated()) {
            window.location.href = 'dashboard.html';
        }

        // Password visibility toggle
        passwordToggle.addEventListener('click', (e) => {
            e.preventDefault();
            const isPassword = passwordField.type === 'password';
            passwordField.type = isPassword ? 'text' : 'password';

            // Update icon
            const icon = passwordToggle.querySelector('i');
            icon.setAttribute('data-lucide', isPassword ? 'eye-off' : 'eye');
            lucide.createIcons();
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            // Validate inputs
            if (!email || !password) {
                showAlert('Please fill in all fields', 'danger');
                return;
            }

            // Attempt login
            const result = await adminDataService.loginAdmin(email, password);

            if (result.success) {
                showAlert('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
            } else {
                showAlert(result.message || 'Invalid email or password', 'danger');
            }
        });

        function showAlert(message, type) {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.innerHTML = `
                <span class="alert-icon">
                    ${type === 'success' ? '✓' : type === 'danger' ? '✕' : 'ℹ'}
                </span>
                <span>${message}</span>
            `;
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alert);

            if (type === 'success') {
                setTimeout(() => alert.remove(), 2000);
            }
        }

        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
