<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - FJL Admin Panel</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../notifications.js"></script>
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="sidebar-logo"><span>FJL</span></div>
            <ul class="sidebar-menu">
                <li class="sidebar-menu-item"><a href="dashboard.html" class="sidebar-menu-link"><i data-lucide="bar-chart-3" style="width: 20px; height: 20px; display: inline-block; margin-right: 8px;"></i>Dashboard</a></li>
                <li class="sidebar-menu-item"><a href="products.html" class="sidebar-menu-link"><i data-lucide="package" style="width: 20px; height: 20px; display: inline-block; margin-right: 8px;"></i>Products</a></li>
                <li class="sidebar-menu-item"><a href="orders.html" class="sidebar-menu-link"><i data-lucide="shopping-cart" style="width: 20px; height: 20px; display: inline-block; margin-right: 8px;"></i>Orders</a></li>
                <li class="sidebar-menu-item"><a href="customers.html" class="sidebar-menu-link"><i data-lucide="users" style="width: 20px; height: 20px; display: inline-block; margin-right: 8px;"></i>Customers</a></li>
                <li class="sidebar-menu-item"><a href="analytics.html" class="sidebar-menu-link"><i data-lucide="trending-up" style="width: 20px; height: 20px; display: inline-block; margin-right: 8px;"></i>Analytics</a></li>
                <li class="sidebar-menu-item"><a href="settings.html" class="sidebar-menu-link active"><i data-lucide="settings" style="width: 20px; height: 20px; display: inline-block; margin-right: 8px;"></i>Settings</a></li>
            </ul>
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="sidebar-avatar">A</div>
                    <div><div style="font-size: 12px; opacity: 0.7;">Logged in as</div><div style="font-weight: 600;" id="adminName">Admin</div></div>
                </div>
                <button class="btn btn-secondary btn-sm btn-block" onclick="logoutAdmin()">Logout</button>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <h2 class="header-title">Settings & Account</h2>
                <button class="header-icon-btn" onclick="toggleSidebar()">≡</button>
            </header>

            <div class="admin-content">
                <!-- Store Information -->
                <div class="card mb-xl">
                    <div class="card-header">
                        <h3 class="card-title">Store Information</h3>
                    </div>
                    <form id="storeForm" onsubmit="saveStoreSettings(event)">
                        <div class="card-body">
                            <div class="form-group-row">
                                <div class="form-group">
                                    <label class="form-label">Business Name</label>
                                    <input type="text" id="businessName" class="form-control">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Store Name</label>
                                    <input type="text" id="storeName" class="form-control">
                                </div>
                            </div>

                            <div class="form-group-row">
                                <div class="form-group">
                                    <label class="form-label">Store Email</label>
                                    <input type="email" id="storeEmail" class="form-control">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Store Phone</label>
                                    <input type="tel" id="storePhone" class="form-control">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Store Address</label>
                                <textarea id="storeAddress" class="form-textarea" rows="3"></textarea>
                            </div>

                            <div class="form-group-row">
                                <div class="form-group">
                                    <label class="form-label">Tax Rate (%)</label>
                                    <input type="number" id="taxRate" class="form-control" min="0" max="100" step="0.01">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Shipping Cost (₦)</label>
                                    <input type="number" id="shippingCost" class="form-control" min="0">
                                </div>
                            </div>
                        </div>
                        <div class="card-footer">
                            <button type="submit" class="btn btn-primary">Save Store Settings</button>
                        </div>
                    </form>
                </div>

                <!-- Bank Account Details -->
                <div class="card mb-xl">
                    <div class="card-header">
                        <h3 class="card-title">Bank Account Details</h3>
                    </div>
                    <form id="bankForm" onsubmit="saveBankSettings(event)">
                        <div class="card-body">
                            <div class="form-group">
                                <label class="form-label">Bank Name</label>
                                <input type="text" id="bankName" class="form-control" value="First Bank Nigeria">
                            </div>

                            <div class="form-group-row">
                                <div class="form-group">
                                    <label class="form-label">Account Number</label>
                                    <input type="text" id="accountNumber" class="form-control">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Account Holder Name</label>
                                    <input type="text" id="accountHolder" class="form-control">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Account Type</label>
                                <input type="text" id="accountType" class="form-control" placeholder="e.g., Business Account">
                            </div>

                            <div class="form-group-row">
                                <div class="form-group">
                                    <label class="form-label">Currency Code</label>
                                    <input type="text" id="currency" class="form-control" maxlength="3" placeholder="e.g., NGN">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Currency Symbol</label>
                                    <input type="text" id="currencySymbol" class="form-control" maxlength="5" placeholder="e.g., ₦">
                                </div>
                            </div>
                        </div>
                        <div class="card-footer">
                            <button type="submit" class="btn btn-primary">Save Bank Details</button>
                            <span id="bankSaveStatus" style="margin-left: 12px; font-size: 14px;"></span>
                        </div>
                    </form>
                </div>

                <!-- Account Security -->
                <div class="card mb-xl">
                    <div class="card-header">
                        <h3 class="card-title">Account Security</h3>
                    </div>
                    <form id="securityForm" onsubmit="changePassword(event)">
                        <div class="card-body">
                            <div class="form-group">
                                <label class="form-label">Current Password</label>
                                <input type="password" id="currentPassword" class="form-control" required>
                            </div>

                            <div class="form-group-row">
                                <div class="form-group">
                                    <label class="form-label">New Password</label>
                                    <input type="password" id="newPassword" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Confirm Password</label>
                                    <input type="password" id="confirmPassword" class="form-control" required>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer">
                            <button type="submit" class="btn btn-primary">Change Password</button>
                        </div>
                    </form>
                </div>

                <!-- System Information -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">System Information</h3>
                    </div>
                    <div class="card-body">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-lg);">
                            <div>
                                <div style="font-size: 12px; color: var(--color-gray); text-transform: uppercase; margin-bottom: var(--spacing-xs);">Admin Panel Version</div>
                                <div style="font-weight: 600;">1.0.0</div>
                            </div>
                            <div>
                                <div style="font-size: 12px; color: var(--color-gray); text-transform: uppercase; margin-bottom: var(--spacing-xs);">Last Updated</div>
                                <div style="font-weight: 600;" id="lastUpdated">-</div>
                            </div>
                            <div>
                                <div style="font-size: 12px; color: var(--color-gray); text-transform: uppercase; margin-bottom: var(--spacing-xs);">Total Products</div>
                                <div style="font-weight: 600;" id="totalProducts">0</div>
                            </div>
                            <div>
                                <div style="font-size: 12px; color: var(--color-gray); text-transform: uppercase; margin-bottom: var(--spacing-xs);">Total Orders</div>
                                <div style="font-weight: 600;" id="totalOrders">0</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="admin.js"></script>
    <script>
        if (!checkAdminAuth()) {
            window.location.href = '/admin/index.html';
        } else {
            initializeSettings();
        }

        function initializeSettings() {
            const adminInfo = adminDataService.getAdminInfo();
            document.getElementById('adminName').textContent = adminInfo.email.split('@')[0];
            loadSettings();
        }

        function loadSettings() {
            const settings = adminDataService.getAdminSettings();

            // Load store settings from localStorage (fallback for fields not in database)
            document.getElementById('businessName').value = settings.businessName || '';
            document.getElementById('storeName').value = settings.storeName || '';
            document.getElementById('storePhone').value = settings.storePhone || '';
            document.getElementById('storeAddress').value = settings.storeAddress || '';

            // Load store settings from API (overrides localStorage for these fields)
            loadStoreSettingsFromAPI();

            // Load bank settings from API
            loadBankSettings();

            // System info
            const analytics = adminDataService.getAnalytics();
            document.getElementById('totalProducts').textContent = analytics.totalProducts;
            document.getElementById('totalOrders').textContent = analytics.totalOrders;
            document.getElementById('lastUpdated').textContent = formatDate(new Date());
        }

        // Load store settings from backend API
        async function loadStoreSettingsFromAPI() {
            try {
                console.log('Loading store settings from API...');

                // Construct the full API URL
                const apiUrl = 'http://localhost:5001/api/settings';
                console.log('Fetching from:', apiUrl);

                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                console.log('API Response Status:', response.status);

                if (!response.ok) {
                    console.error('API response not ok:', response.status, response.statusText);
                    const text = await response.text();
                    console.error('Response body:', text);
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                console.log('✅ Store settings loaded:', data);

                const settings = data.data || data;

                // Populate store settings fields from API
                // Map API field names to HTML form IDs
                document.getElementById('businessName').value = settings.business_name || '';
                document.getElementById('storeName').value = settings.store_name || '';
                document.getElementById('storeEmail').value = settings.store_email || '';
                document.getElementById('storePhone').value = settings.store_phone || '';
                document.getElementById('storeAddress').value = settings.store_address || '';
                document.getElementById('taxRate').value = settings.tax_rate || 7.5;
                document.getElementById('shippingCost').value = settings.shipping_cost || 0;

                console.log('✅ Store settings populated successfully');
            } catch (error) {
                console.error('❌ Error loading store settings:', error);
                console.error('Error stack:', error.stack);

                // Use defaults if API call fails
                document.getElementById('storeEmail').value = '';
                document.getElementById('taxRate').value = 7.5;
                document.getElementById('shippingCost').value = 0;
            }
        }

        // Load bank settings from backend API
        async function loadBankSettings() {
            try {
                console.log('Loading bank settings from API...');

                // Construct the full API URL
                const apiUrl = 'http://localhost:5001/api/settings';
                console.log('Fetching from:', apiUrl);

                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                console.log('API Response Status:', response.status);
                console.log('API Response Headers:', {
                    'content-type': response.headers.get('content-type')
                });

                if (!response.ok) {
                    console.error('API response not ok:', response.status, response.statusText);
                    const text = await response.text();
                    console.error('Response body:', text);
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                console.log('✅ Bank settings loaded:', data);

                const settings = data.data || data;

                // Populate all form fields
                document.getElementById('bankName').value = settings.bank_name || 'Access Bank';
                document.getElementById('accountNumber').value = settings.account_number || '';
                document.getElementById('accountHolder').value = settings.account_name || '';
                document.getElementById('accountType').value = settings.account_type || '';
                document.getElementById('currency').value = settings.currency || 'NGN';
                document.getElementById('currencySymbol').value = settings.currency_symbol || '₦';

                console.log('✅ Bank settings populated successfully');
            } catch (error) {
                console.error('❌ Error loading bank settings:', error);
                console.error('Error stack:', error.stack);

                // Use defaults if API call fails
                document.getElementById('bankName').value = 'Access Bank';
                document.getElementById('accountNumber').value = '';
                document.getElementById('accountHolder').value = '';
                document.getElementById('accountType').value = '';
                document.getElementById('currency').value = 'NGN';
                document.getElementById('currencySymbol').value = '₦';
            }
        }

        async function saveStoreSettings(event) {
            event.preventDefault();

            // Save to localStorage (for fields not in database)
            const localStorageUpdates = {
                businessName: document.getElementById('businessName').value,
                storeName: document.getElementById('storeName').value,
                storePhone: document.getElementById('storePhone').value,
                storeAddress: document.getElementById('storeAddress').value
            };
            adminDataService.updateAdminSettings(localStorageUpdates);

            // Save to API (for database fields)
            try {
                const token = localStorage.getItem('fjl_token') || '';

                const apiUpdates = {
                    business_name: document.getElementById('businessName').value,
                    store_name: document.getElementById('storeName').value,
                    store_email: document.getElementById('storeEmail').value,
                    store_phone: document.getElementById('storePhone').value,
                    store_address: document.getElementById('storeAddress').value,
                    tax_rate: parseFloat(document.getElementById('taxRate').value),
                    shipping_cost: parseFloat(document.getElementById('shippingCost').value)
                };

                const response = await fetch('http://localhost:5001/api/settings', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(apiUpdates)
                });

                if (!response.ok) {
                    const text = await response.text();
                    console.error('Response text:', text);
                    try {
                        const error = JSON.parse(text);
                        throw new Error(error.error || `HTTP error! status: ${response.status}`);
                    } catch (e) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                }

                notifications.success('Store settings saved successfully!');
            } catch (error) {
                console.error('Error saving store settings to API:', error);
                notifications.error('Failed to save some settings: ' + error.message);
            }
        }

        async function saveBankSettings(event) {
            event.preventDefault();

            const statusEl = document.getElementById('bankSaveStatus');
            statusEl.textContent = 'Saving...';
            statusEl.style.color = '#0066cc';

            try {
                const token = localStorage.getItem('fjl_token') || '';

                const updates = {
                    bank_name: document.getElementById('bankName').value,
                    account_number: document.getElementById('accountNumber').value,
                    account_name: document.getElementById('accountHolder').value,
                    account_type: document.getElementById('accountType').value,
                    currency: document.getElementById('currency').value,
                    currency_symbol: document.getElementById('currencySymbol').value
                };

                const response = await fetch('http://localhost:5001/api/settings', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(updates)
                });

                if (!response.ok) {
                    const text = await response.text();
                    console.error('Response text:', text);
                    try {
                        const error = JSON.parse(text);
                        throw new Error(error.error || `HTTP error! status: ${response.status}`);
                    } catch (e) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                }

                statusEl.textContent = '✅ Saved successfully!';
                statusEl.style.color = '#28a745';
                notifications.success('Bank details saved successfully!');

                setTimeout(() => {
                    statusEl.textContent = '';
                }, 3000);
            } catch (error) {
                console.error('Error saving bank settings:', error);
                statusEl.textContent = '❌ Save failed';
                statusEl.style.color = '#dc3545';
                notifications.error('Failed to save bank details: ' + error.message);
            }
        }

        function changePassword(event) {
            event.preventDefault();

            const admin = adminDataService.getAdminSettings();
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (admin.password !== currentPassword) {
                notifications.error('Current password is incorrect!');
                return;
            }

            if (newPassword !== confirmPassword) {
                notifications.error('New passwords do not match!');
                return;
            }

            if (newPassword.length < 6) {
                notifications.error('Password must be at least 6 characters long!');
                return;
            }

            adminDataService.updateAdminSettings({ password: newPassword });
            document.getElementById('securityForm').reset();
            notifications.success('Password changed successfully! Please log in again.');
            setTimeout(() => {
                adminDataService.logoutAdmin();
                window.location.href = 'index.html';
            }, 1500);
        }

        function toggleSidebar() {
            document.querySelector('.admin-sidebar').classList.toggle('open');
        }

        function logoutAdmin() {
            notifications.confirm('Are you sure you want to logout?', () => {
                adminDataService.logoutAdmin();
                window.location.href = 'index.html';
            });
        }

        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
