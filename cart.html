<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Summary - Famous Jelly Luxe (FJL)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');

        * {
            font-family: 'Inter', sans-serif;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Poppins', sans-serif;
        }

        :root {
            --color-primary: #000;
            --color-secondary: #fff;
            --color-accent: #E09F3E;
            --color-gray: #8b8b8b;
        }

        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: white;
        }

        /* Mobile Menu Styles */
        .mobile-menu-btn {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 8px;
        }

        .mobile-menu-btn span {
            width: 24px;
            height: 3px;
            background: black;
            transition: all 0.3s ease;
        }

        .mobile-menu-btn.active span:nth-child(1) {
            transform: rotate(45deg) translate(8px, 8px);
        }

        .mobile-menu-btn.active span:nth-child(2) {
            transform: rotate(-45deg) translate(7px, -7px);
        }

        @media (max-width: 768px) {
            .mobile-menu-btn {
                display: flex;
            }
        }

        .mobile-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 40;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .mobile-menu.active {
            transform: translateX(0);
        }

        .mobile-menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #e5e5e5;
            position: sticky;
            top: 0;
            background: white;
            z-index: 41;
        }

        .mobile-menu-close {
            font-size: 28px;
            cursor: pointer;
            background: none;
            border: none;
            color: black;
        }

        .mobile-menu-content {
            flex: 1;
            padding: 20px 16px;
        }

        .mobile-menu-links {
            display: flex;
            flex-direction: column;
            gap: 0;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .mobile-menu-links li {
            border-bottom: 1px solid #e5e5e5;
        }

        .mobile-menu-links a {
            display: block;
            padding: 16px 0;
            text-decoration: none;
            color: #333;
            font-size: 16px;
            font-weight: 500;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .mobile-menu-links a:hover {
            color: #E09F3E;
        }

        /* Hide header when mobile menu is open */
        @media (max-width: 768px) {
            body.menu-open {
                overflow: hidden;
            }
            body.menu-open .sticky-header {
                display: none;
            }
        }

        .top-banner {
            background: black;
            color: white;
            padding: 8px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        .summary-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            margin-top: 32px;
        }

        @media (max-width: 768px) {
            .summary-container {
                grid-template-columns: 1fr;
            }
        }

        .summary-section {
            background: #f9f9f9;
            padding: 24px;
            border-radius: 8px;
        }

        .summary-section h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .item-card {
            background: white;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #e5e5e5;
            border-radius: 4px;
            display: flex;
            gap: 16px;
            transition: all 0.3s ease;
            position: relative;
        }

        .item-card:hover {
            border-color: var(--color-accent);
            box-shadow: 0 2px 8px rgba(224, 159, 62, 0.1);
        }

        .item-image {
            width: 100px;
            height: 100px;
            background: #f5f5f5;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .item-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .item-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .item-meta {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }

        .item-price {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-primary);
            margin-top: 8px;
        }

        .item-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 12px;
        }

        .edit-btn, .remove-btn {
            padding: 6px 12px;
            border: 1px solid #e5e5e5;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .edit-btn:hover {
            background: var(--color-accent);
            color: white;
            border-color: var(--color-accent);
        }

        .remove-btn:hover {
            background: #fee;
            color: #c00;
            border-color: #c00;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #e5e5e5;
            border-radius: 4px;
            padding: 0;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            border: none;
            background: white;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .qty-btn:hover {
            background: #f5f5f5;
        }

        .qty-display {
            min-width: 30px;
            text-align: center;
            font-weight: 600;
            font-size: 12px;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 20px;
            font-weight: 700;
            margin: 0;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            color: var(--color-primary);
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: var(--color-primary);
            letter-spacing: 0.5px;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e5e5e5;
            border-radius: 4px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px rgba(224, 159, 62, 0.1);
        }

        .color-options {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            border: 2px solid #e5e5e5;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .color-option:hover {
            transform: scale(1.05);
        }

        .color-option.active {
            border-color: var(--color-accent);
            box-shadow: 0 0 0 2px white, 0 0 0 4px var(--color-accent);
        }

        .modal-footer {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        .modal-footer button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-footer .btn-save {
            background: var(--color-primary);
            color: white;
        }

        .modal-footer .btn-save:hover {
            background: #333;
        }

        .modal-footer .btn-cancel {
            background: #f5f5f5;
            color: var(--color-primary);
            border: 1px solid #e5e5e5;
        }

        .modal-footer .btn-cancel:hover {
            background: #eee;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e5e5e5;
            font-size: 14px;
        }

        .price-row:last-child {
            border-bottom: none;
            font-weight: 700;
            font-size: 16px;
            padding-top: 16px;
            color: var(--color-primary);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .btn-checkout {
            background: var(--color-primary);
            color: white;
        }

        .btn-checkout:hover {
            background: #333;
        }

        .btn-continue {
            background: white;
            color: var(--color-primary);
            border: 2px solid var(--color-primary);
        }

        .btn-continue:hover {
            background: #f5f5f5;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state h2 {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .empty-state p {
            color: #666;
            margin-bottom: 24px;
        }

        .empty-state a {
            display: inline-block;
            background: var(--color-primary);
            color: white;
            padding: 12px 32px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
        }

        /* Mobile Responsive for Cart */
        @media (max-width: 767px) {
            .item-card {
                flex-direction: column;
                gap: 12px;
            }

            .item-image {
                width: 100%;
                height: 200px;
            }

            .item-details {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .quantity-input {
                min-height: 44px;
                font-size: 16px !important;
            }

            .remove-btn {
                min-height: 44px;
                min-width: 44px;
                padding: 12px !important;
                font-size: 14px;
            }

            .summary-container {
                grid-template-columns: 1fr !important;
                gap: 24px;
            }

            .summary-section {
                padding: 20px !important;
            }

            .summary-row {
                font-size: 14px;
                padding: 12px 0;
            }

            .checkout-btn {
                width: 100% !important;
                min-height: 44px;
                font-size: 16px;
                padding: 12px !important;
            }

            .continue-shopping {
                width: 100% !important;
                min-height: 44px;
                font-size: 16px;
                padding: 12px !important;
            }
        }
    </style>
</head>
<body>
    <!-- Top banner -->
    <div class="top-banner">
        FAMOUS JELLY LUXE - LUXURY STREETWEAR
    </div>

    <!-- Header -->
    <header class="sticky-header">
        <nav class="bg-white border-b border-gray-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-16">
                    <!-- Mobile Menu Button (Left) -->
                    <button class="mobile-menu-btn md:hidden" id="mobileMenuBtn" onclick="toggleMobileMenu()">
                        <span></span>
                        <span></span>
                    </button>

                    <!-- Left nav items -->
                    <div class="hidden md:flex gap-8">
                        <a href="index.html" class="text-gray-700 text-sm font-medium hover:text-black transition">HOME</a>
                        <a href="about.html" class="text-gray-700 text-sm font-medium hover:text-black transition">ABOUT US</a>
                        <a href="shop.html" class="text-gray-700 text-sm font-medium hover:text-black transition">SHOP</a>
                        <a href="contact.html" class="text-gray-700 text-sm font-medium hover:text-black transition">CONTACT US</a>
                    </div>

                    <!-- Logo -->
                    <div class="absolute left-1/2 transform -translate-x-1/2">
                        <a href="index.html" style="display: inline-block; text-decoration: none;">
                            <img src="/ftg-logo.svg" alt="FJL Logo" style="height: 40px; width: auto; cursor: pointer;">
                        </a>
                    </div>

                    <!-- Right icons -->
                    <div class="flex gap-6 items-center">
                        <a href="cart.html" class="text-gray-700 hover:text-[#E09F3E] transition flex relative" aria-label="Shopping cart">
                            <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                            <span id="cartBadge" class="absolute -top-2 -right-2 bg-red-600 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold" style="display: none;">0</span>
                        </a>
                        <button class="text-gray-700 hover:text-[#E09F3E] transition hidden md:flex" aria-label="Search">
                            <i data-lucide="search" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Mobile Menu -->
    <div class="mobile-menu" id="mobileMenu">
        <div class="mobile-menu-header">
            <a href="index.html" style="display: inline-block; text-decoration: none;" onclick="toggleMobileMenu()">
                <img src="/ftg-logo.svg" alt="FJL Logo" style="height: 32px; width: auto; cursor: pointer;">
            </a>
            <button class="mobile-menu-close" onclick="toggleMobileMenu()">×</button>
        </div>
        <div class="mobile-menu-content">
            <ul class="mobile-menu-links">
                <li><a href="index.html" onclick="toggleMobileMenu()">HOME</a></li>
                <li><a href="about.html" onclick="toggleMobileMenu()">ABOUT US</a></li>
                <li><a href="shop.html" onclick="toggleMobileMenu()">SHOP</a></li>
                <li><a href="contact.html" onclick="toggleMobileMenu()">CONTACT US</a></li>
            </ul>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div style="margin-bottom: 24px;">
            <a href="shop.html" class="text-sm text-gray-600 hover:text-black">← Back to Shopping</a>
        </div>

        <h1 style="font-size: 32px; font-weight: 700; margin-bottom: 8px;">ORDER SUMMARY</h1>
        <p style="color: #666; margin-bottom: 24px;">Review your items before proceeding to checkout</p>

        <div id="summaryContent">
            <!-- Items will be populated here -->
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Item</h2>
                <button class="modal-close" onclick="closeEditModal()">×</button>
            </div>
            <form id="editForm">
                <div class="form-group">
                    <label for="sizeSelect">Size</label>
                    <select id="sizeSelect" required>
                        <option value="XS">Extra Small (XS)</option>
                        <option value="S">Small (S)</option>
                        <option value="M">Medium (M)</option>
                        <option value="L">Large (L)</option>
                        <option value="XL">Extra Large (XL)</option>
                        <option value="XXL">2XL</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Color</label>
                    <div class="color-options" id="colorOptions"></div>
                </div>

                <div class="form-group">
                    <label for="quantityInput">Quantity</label>
                    <div id="editModalStockInfo" style="font-size: 12px; color: #666; margin-bottom: 8px;"></div>
                    <input type="number" id="quantityInput" min="1" max="99" required>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="btn-save">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer style="background: white; border-top: 1px solid #e5e5e5; margin-top: 60px; padding: 40px 0;">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center text-sm text-gray-600">
                <p>© 2025 Famous Jelly Luxe . All Rights Reserved</p>
            </div>
        </div>
    </footer>

    <script>
        // Toggle mobile menu
        function toggleMobileMenu() {
            const mobileMenu = document.getElementById('mobileMenu');
            const menuBtn = document.getElementById('mobileMenuBtn');
            const body = document.body;

            if (mobileMenu.classList.contains('active')) {
                mobileMenu.classList.remove('active');
                menuBtn.classList.remove('active');
                body.classList.remove('menu-open');
            } else {
                mobileMenu.classList.add('active');
                menuBtn.classList.add('active');
                body.classList.add('menu-open');
            }
        }

        const COLORS = {
            'Black': '#000000',
            'White': '#FFFFFF',
            'Navy': '#001f3f',
            'Gold': '#E09F3E',
            'Red': '#FF4136',
            'Green': '#2ECC40'
        };

        class Cart {
            constructor() {
                this.items = JSON.parse(localStorage.getItem('fjl_cart')) || [];
            }

            getTotal() {
                return this.items.reduce((total, item) => total + (item.price * item.quantity), 0);
            }

            getItemCount() {
                return this.items.reduce((count, item) => count + item.quantity, 0);
            }

            updateItem(index, updates) {
                if (this.items[index]) {
                    Object.assign(this.items[index], updates);
                    this.save();
                }
            }

            removeItem(index) {
                this.items.splice(index, 1);
                this.save();
            }

            save() {
                localStorage.setItem('fjl_cart', JSON.stringify(this.items));
            }
        }

        let cart = new Cart();
        let currentEditingIndex = null;

        function updateCartBadge() {
            const badge = document.getElementById('cartBadge');
            const count = cart.getItemCount();
            if (count > 0) {
                badge.textContent = count;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
        }

        // NEW: Update edit modal stock info when color selection changes
        function updateEditModalStock(selectedColor) {
            const size = document.getElementById('sizeSelect').value;
            const product = cart.items[currentEditingIndex];

            // Query product data from localStorage to find variant stock
            let allProducts = [];
            try {
                allProducts = JSON.parse(localStorage.getItem('fjl_products')) || [];
            } catch (e) {
                console.error('Error reading products from localStorage:', e);
                return;
            }

            const productData = allProducts.find(p => p.id === product.id);
            if (!productData || !productData.variants) {
                console.warn('Product data or variants not found for color update');
                return;
            }

            // Find the variant for the selected color and current size
            const variant = productData.variants.find(v =>
                v.color === selectedColor && v.size === size
            );

            if (!variant) {
                console.warn(`Variant not found for ${selectedColor}-${size}`);
                return;
            }

            const variantStock = variant.stock_quantity || 0;

            // Update stock info display
            const stockInfo = document.getElementById('editModalStockInfo');
            if (variantStock && variantStock < 99) {
                stockInfo.textContent = `${variantStock} available in stock for ${selectedColor}`;
                if (variantStock < 5) {
                    stockInfo.style.color = '#e74c3c';
                    stockInfo.innerHTML = `⚠️ Only <strong>${variantStock}</strong> available in stock for ${selectedColor}`;
                } else {
                    stockInfo.style.color = '#27ae60';
                    stockInfo.textContent = `${variantStock} available in stock for ${selectedColor}`;
                }
            } else {
                stockInfo.textContent = 'Stock info unavailable';
            }

            // Update quantity input max attribute to match the variant stock
            document.getElementById('quantityInput').max = variantStock.toString();

            console.log(`📊 Updated stock display for ${selectedColor}: ${variantStock} available`);
        }

        function openEditModal(index) {
            currentEditingIndex = index;
            const item = cart.items[index];
            // NEW: Use variant-specific stock if available, fallback to size-only stock
            let maxAvailable = item.variantStock || item.maxQuantity;

            if (!maxAvailable) {
                console.warn(`⚠️  Cart item "${item.name}" missing stock data. This indicates a data integrity issue.`);
                // Fail-safe: only allow current quantity if stock info is missing
                maxAvailable = item.quantity;
            }

            document.getElementById('sizeSelect').value = item.size || 'M';
            document.getElementById('quantityInput').value = item.quantity;
            document.getElementById('quantityInput').max = maxAvailable.toString();

            // Display stock information - shows variant-specific stock
            const stockInfo = document.getElementById('editModalStockInfo');
            if (maxAvailable && maxAvailable < 99) {
                stockInfo.textContent = `${maxAvailable} available in stock (${item.color})`;
                if (maxAvailable < 5) {
                    stockInfo.style.color = '#e74c3c';
                    stockInfo.innerHTML = `⚠️ Only <strong>${maxAvailable}</strong> available in stock for ${item.color}`;
                }
            } else {
                stockInfo.textContent = 'Stock info unavailable';
            }

            // Fetch actual product data to get correct sizes and colors
            let product = null;
            try {
                const allProducts = JSON.parse(localStorage.getItem('fjl_products')) || [];
                product = allProducts.find(p => p.id === item.id);
            } catch (e) {
                console.error('Error fetching product data:', e);
            }

            // Populate size dropdown with actual product sizes
            const sizeSelect = document.getElementById('sizeSelect');
            if (product && product.variants && product.variants.length > 0) {
                // Extract unique sizes from variants
                const sizesSet = new Set();
                product.variants.forEach(variant => {
                    if (variant.size) {
                        sizesSet.add(variant.size);
                    }
                });
                const sizes = Array.from(sizesSet);

                if (sizes.length > 0) {
                    sizeSelect.innerHTML = '';
                    sizes.forEach(size => {
                        const option = document.createElement('option');
                        option.value = size;
                        option.textContent = size;
                        sizeSelect.appendChild(option);
                    });
                    sizeSelect.value = item.size || (sizes.length > 0 ? sizes[0] : 'M');
                }
            }

            // Render color options from actual product variants
            const colorContainer = document.getElementById('colorOptions');
            colorContainer.innerHTML = '';

            if (product && product.variants && product.variants.length > 0) {
                // Extract unique colors from variants
                const colorsSet = new Set();
                const colorMap = {}; // Map color name to hex value

                product.variants.forEach(variant => {
                    if (variant.color) {
                        colorsSet.add(variant.color);
                        // Try to get hex color if available, otherwise use generic color
                        if (!colorMap[variant.color]) {
                            colorMap[variant.color] = getColorHex(variant.color);
                        }
                    }
                });

                const colors = Array.from(colorsSet);

                if (colors.length > 0) {
                    colors.forEach(color => {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'color-option' + (item.color === color ? ' active' : '');
                        btn.style.backgroundColor = colorMap[color];
                        btn.title = color;
                        btn.onclick = (e) => {
                            e.preventDefault();
                            document.querySelectorAll('.color-option').forEach(b => b.classList.remove('active'));
                            btn.classList.add('active');
                            updateEditModalStock(color); // NEW: Update stock when color changes
                        };
                        colorContainer.appendChild(btn);
                    });
                } else {
                    // Fallback to hardcoded colors if no colors in variants
                    Object.entries(COLORS).forEach(([name, hex]) => {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'color-option' + (item.color === name ? ' active' : '');
                        btn.style.backgroundColor = hex;
                        btn.title = name;
                        btn.onclick = (e) => {
                            e.preventDefault();
                            document.querySelectorAll('.color-option').forEach(b => b.classList.remove('active'));
                            btn.classList.add('active');
                            updateEditModalStock(name); // NEW: Update stock when color changes
                        };
                        colorContainer.appendChild(btn);
                    });
                }
            } else {
                // Fallback to hardcoded colors if product not found
                Object.entries(COLORS).forEach(([name, hex]) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'color-option' + (item.color === name ? ' active' : '');
                    btn.style.backgroundColor = hex;
                    btn.title = name;
                    btn.onclick = (e) => {
                        e.preventDefault();
                        document.querySelectorAll('.color-option').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        updateEditModalStock(name); // NEW: Update stock when color changes
                    };
                    colorContainer.appendChild(btn);
                });
            }

            document.getElementById('editModal').classList.add('active');
        }

        // Helper function to get hex color from color name
        function getColorHex(colorName) {
            const colorMap = {
                'Black': '#000000',
                'White': '#FFFFFF',
                'Navy': '#001f3f',
                'Gold': '#E09F3E',
                'Red': '#FF4136',
                'Green': '#2ECC40',
                'Purple': '#B10DC9',
                'Blue': '#0074D9',
                'Cream': '#FFFDD0',
                'Beige': '#F5E6D3',
                'Gray': '#AAAAAA',
                'Burgundy': '#800020',
                'Olive': '#808000'
            };
            return colorMap[colorName] || '#999999';
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            currentEditingIndex = null;
        }

        document.getElementById('editForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const size = document.getElementById('sizeSelect').value;
            const quantity = parseInt(document.getElementById('quantityInput').value);
            const colorBtn = document.querySelector('.color-option.active');
            const item = cart.items[currentEditingIndex];

            // Get color from button's title attribute (works with both hardcoded and dynamic colors)
            const color = colorBtn ? colorBtn.title : 'Black';

            // NEW: Dynamically look up the variant stock for the SELECTED color and size
            let maxAvailable = item.maxQuantity || 99; // Fallback to size-only stock

            try {
                const allProducts = JSON.parse(localStorage.getItem('fjl_products')) || [];
                const productData = allProducts.find(p => p.id === item.id);

                if (productData && productData.variants) {
                    const variant = productData.variants.find(v =>
                        v.color === color && v.size === size
                    );

                    if (variant) {
                        maxAvailable = variant.stock_quantity || 0;
                    }
                }
            } catch (err) {
                console.error('Error looking up variant stock:', err);
                // Fall back to item's variantStock or maxQuantity
                maxAvailable = item.variantStock || item.maxQuantity || 99;
            }

            // Validate quantity against available stock (using dynamically looked up variant stock)
            if (quantity > maxAvailable) {
                if (notifications) {
                    notifications.error(`Cannot set quantity to ${quantity}. Only ${maxAvailable} ${item.name} (${color}-${size}) available in stock`);
                }
                console.log(`❌ Validation failed: Requested quantity (${quantity}) exceeds available variant stock (${maxAvailable})`);
                return;
            }

            cart.updateItem(currentEditingIndex, { size, quantity, color });
            renderSummary();
            updateCartBadge();
            closeEditModal();
            if (notifications) {
                notifications.success('Item updated successfully');
            }
        });

        function removeItem(index) {
            if (notifications) {
                notifications.confirm('Are you sure you want to remove this item from your cart?', () => {
                    cart.removeItem(index);
                    renderSummary();
                    updateCartBadge();
                    notifications.success('Item removed from cart');
                });
            }
        }

        function clearCart() {
            if (notifications) {
                notifications.confirm('Are you sure you want to clear your entire cart? This action cannot be undone.', () => {
                    try {
                        cart.clear();
                        renderSummary();
                        updateCartBadge();
                        notifications.success('Cart cleared successfully');
                    } catch (e) {
                        console.error('Error clearing cart:', e);
                        // Fallback: manually clear localStorage
                        localStorage.setItem('fjl_cart', JSON.stringify([]));
                        cart = new Cart();
                        renderSummary();
                        updateCartBadge();
                        notifications.success('Cart cleared successfully');
                    }
                });
            }
        }

        function updateQuantity(index, delta) {
            const item = cart.items[index];
            const newQty = item.quantity + delta;

            // NEW: Use variant-specific stock if available, fallback to size-only stock
            let maxAvailable = item.variantStock || item.maxQuantity;

            // Defensive: Handle missing stock data with explicit type checking
            if (typeof maxAvailable === 'undefined' || maxAvailable === null) {
                console.warn(`⚠️  Cart item "${item.name}" missing stock data. Using conservative fallback (current qty).`);
                // Only allow current quantity (fail-safe) when stock info is missing
                maxAvailable = item.quantity;
            }

            // Ensure effectiveMax is a valid number
            const effectiveMax = typeof maxAvailable === 'number' ? maxAvailable : item.quantity;

            // Validate quantity against available stock
            if (newQty > 0 && newQty <= 99) {
                if (newQty > effectiveMax) {
                    // Show warning if exceeding available stock
                    if (typeof notifications !== 'undefined' && notifications) {
                        notifications.warning(`Only ${effectiveMax} ${item.name} (${item.color}-${item.size}) available in stock`);
                    }
                    console.log(`⚠️ Cannot increase quantity: Only ${effectiveMax} available, requested ${newQty}`);
                    return;
                }

                cart.updateItem(index, { quantity: newQty });
                renderSummary();
                updateCartBadge();
            } else if (newQty === 0) {
                // Prevent going below 1, but allow removal via remove button
                console.log('Quantity cannot be less than 1');
            }
        }

        function renderSummary() {
            const container = document.getElementById('summaryContent');

            if (cart.items.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>Your Cart is Empty</h2>
                        <p>Add items to your cart before checkout</p>
                        <a href="shop.html">Continue Shopping</a>
                    </div>
                `;
                return;
            }

            const subtotal = cart.getTotal();
            const tax = subtotal * 0.075;
            const total = subtotal + tax;

            let itemsHTML = '';
            cart.items.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                itemsHTML += `
                    <div class="item-card">
                        <div class="item-image">
                            ${item.image && item.image !== 'placeholder' ?
                                `<img src="${item.image}" alt="${item.name}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 4px;">` :
                                `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 40px; height: 40px; color: #ccc;">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                                </svg>`
                            }
                        </div>
                        <div class="item-details">
                            <div class="item-header">
                                <div>
                                    <div class="item-name">${item.name}</div>
                                    <div class="item-meta">Size: ${item.size}</div>
                                    <div class="item-meta">Color: ${item.color || 'Not specified'}</div>
                                    <div class="item-meta" style="color: #27ae60; font-weight: 600; margin-top: 4px;" id="stock-${index}">
                                        ${(() => {
                                            const availableStock = item.variantStock || item.maxQuantity;
                                            return availableStock ? `${availableStock} in stock (${item.color})` : 'Stock info unavailable';
                                        })()}
                                    </div>
                                    ${(() => {
                                        const availableStock = item.variantStock || item.maxQuantity;
                                        return availableStock && availableStock < 5 ? `<div class="item-meta" style="color: #e74c3c; font-weight: 600;">⚠️ Only ${availableStock} of ${item.color} available!</div>` : '';
                                    })()}
                                </div>
                            </div>
                            <div class="item-price">$${itemTotal.toLocaleString('en-CA')}</div>
                            <div class="item-actions">
                                <div class="quantity-controls">
                                    <button type="button" class="qty-btn" onclick="updateQuantity(${index}, -1)">−</button>
                                    <div class="qty-display">${item.quantity}</div>
                                    <button type="button" class="qty-btn" onclick="updateQuantity(${index}, 1)">+</button>
                                </div>
                                <button type="button" class="edit-btn" onclick="openEditModal(${index})">Edit</button>
                                <button type="button" class="remove-btn" onclick="removeItem(${index})">Remove</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="summary-container">
                    <div class="summary-section">
                        <h2>Items (${cart.getItemCount()})</h2>
                        ${itemsHTML}
                        <button type="button" class="btn btn-clear-cart" onclick="clearCart()" style="width: 100%; margin-top: 16px; padding: 12px 16px; background: white; color: #999; border: 1px solid #e5e5e5; border-radius: 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease;">Clear Cart</button>
                    </div>

                    <div class="summary-section">
                        <h2>Order Total</h2>

                        <div class="price-row">
                            <span>Subtotal</span>
                            <span>$${subtotal.toLocaleString('en-CA')}</span>
                        </div>

                        <div class="price-row">
                            <span>Shipping</span>
                            <span>Free</span>
                        </div>

                        <div class="price-row">
                            <span>Tax (7.5%)</span>
                            <span>$${tax.toLocaleString('en-CA')}</span>
                        </div>

                        <div class="price-row">
                            <span>Total</span>
                            <span>$${total.toLocaleString('en-CA')}</span>
                        </div>

                        <div class="button-group">
                            <button class="btn btn-continue" onclick="window.location.href='shop.html'">Continue Shopping</button>
                            <button class="btn btn-checkout" onclick="window.location.href='checkout.html'">Proceed to Checkout</button>
                        </div>
                    </div>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateCartBadge();
            renderSummary();
            // Initialize lucide icons
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });

        // Close modal when clicking outside
        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target.id === 'editModal') {
                closeEditModal();
            }
        });
    </script>
    <script src="notifications.js"></script>
    <!-- Backend API Integration Scripts -->
    <script src="js/api-integration.js"></script>
</body>
</html>
