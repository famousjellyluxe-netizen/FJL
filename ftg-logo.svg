<svg viewBox="0 0 240 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer border rectangle -->
  <rect x="10" y="10" width="220" height="60" fill="none" stroke="#000" stroke-width="3" rx="2"/>

  <!-- Inner border rectangle -->
  <rect x="14" y="14" width="212" height="52" fill="none" stroke="#000" stroke-width="1.5" rx="1"/>

  <!-- FJL Text with tight kerning - using tspan elements with negative letter-spacing -->
  <text
    x="120"
    y="54"
    font-family="Arial, Helvetica, sans-serif"
    font-size="52"
    font-weight="900"
    text-anchor="middle"
    fill="#000"
    letter-spacing="-6"
    style="font-stretch: condensed;"
  >FJL</text>
</svg>