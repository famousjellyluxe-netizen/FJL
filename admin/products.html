<!--
  FJL Admin Panel - Products Page
  Mobile-first responsive products management with Strategy A table
  Key columns visible on mobile, others expandable
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - FJL Admin</title>
    <link rel="icon" type="image/svg+xml" href="/fjl-logo-favicon.svg">

    <!-- Fonts & Icons -->
    <script src="https://unpkg.com/lucide@1.263.1"></script>

    <!-- Design System -->
    <link rel="stylesheet" href="design-tokens.css">
    <link rel="stylesheet" href="styles.css">

    <style>
        /* Products Page Styles */

        .products-wrapper {
            display: flex;
            height: 100vh;
            background: var(--color-bg);
        }

        .products-sidebar {
            width: var(--sidebar-width);
            background: var(--color-primary);
            color: var(--color-secondary);
            overflow-y: auto;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            z-index: var(--z-menu);
        }

        .products-main {
            flex: 1;
            margin-left: var(--sidebar-width);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .products-header {
            background: var(--color-secondary);
            border-bottom: 1px solid var(--color-border);
            padding: var(--spacing-lg) var(--spacing-xl);
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: var(--header-height);
            box-shadow: var(--shadow-sm);
        }

        .products-header-left {
            display: flex;
            align-items: center;
            gap: var(--spacing-lg);
            flex: 1;
        }

        .products-menu-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--color-primary);
            font-size: 24px;
            padding: var(--spacing-md);
            min-width: var(--touch-target-min);
            min-height: var(--touch-target-min);
            border-radius: var(--radius-md);
            transition: var(--transition);
        }

        .products-menu-btn:hover {
            background: var(--color-light-gray);
        }

        .products-title {
            font-size: clamp(18px, 5vw, 24px);
            font-weight: var(--font-weight-bold);
            font-family: var(--font-heading);
            color: var(--color-primary);
        }

        .products-header-right {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .btn-add {
            background: var(--color-accent);
            color: var(--color-primary);
            padding: var(--spacing-md) var(--spacing-lg);
            border: none;
            border-radius: var(--radius-md);
            font-weight: var(--font-weight-semibold);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 12px;
            min-height: 40px;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            transition: var(--transition);
            text-decoration: none;
        }

        .btn-add:hover {
            background: #d4891b;
            text-decoration: none;
            color: var(--color-primary);
        }

        /* Content area */
        .products-content {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-xl);
        }

        /* Filters Bar */
        .filters-bar {
            background: var(--color-secondary);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-xl);
            display: flex;
            gap: var(--spacing-md);
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            gap: var(--spacing-md);
            align-items: center;
            flex: 1;
            min-width: 200px;
        }

        .filter-input {
            flex: 1;
            padding: var(--spacing-md) var(--spacing-lg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-family: var(--font-body);
            background: var(--color-light-gray);
            color: var(--color-primary);
            min-height: 40px;
        }

        .filter-input:focus {
            outline: none;
            border-color: var(--color-accent);
            background: var(--color-secondary);
            box-shadow: 0 0 0 3px rgba(224, 159, 62, 0.1);
        }

        .filter-input::placeholder {
            color: var(--color-gray);
        }

        .filter-select {
            padding: var(--spacing-md) var(--spacing-lg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-family: var(--font-body);
            background: var(--color-light-gray);
            color: var(--color-primary);
            cursor: pointer;
            min-height: 40px;
            transition: var(--transition);
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--color-accent);
            background: var(--color-secondary);
        }

        .filter-actions {
            display: flex;
            gap: var(--spacing-sm);
        }

        .btn-filter-clear {
            background: none;
            border: 1px solid var(--color-border);
            color: var(--color-gray);
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 12px;
            font-weight: var(--font-weight-semibold);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            min-height: 40px;
            transition: var(--transition);
        }

        .btn-filter-clear:hover {
            background: var(--color-light-gray);
            border-color: var(--color-primary);
        }

        /* Products Table */
        .products-table-wrapper {
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            background: var(--color-secondary);
            overflow: hidden;
        }

        .products-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .products-table thead {
            background: var(--color-light-gray);
            border-bottom: 2px solid var(--color-border);
        }

        .products-table th {
            padding: var(--spacing-lg);
            text-align: left;
            font-weight: var(--font-weight-semibold);
            color: var(--color-primary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .products-table tbody tr {
            border-bottom: 1px solid var(--color-border);
            transition: var(--transition);
        }

        .products-table tbody tr:hover {
            background: rgba(224, 159, 62, 0.02);
        }

        .products-table td {
            padding: var(--spacing-lg);
            color: var(--color-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Product Image */
        .product-image {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            background: var(--color-light-gray);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            object-fit: cover;
            flex-shrink: 0;
        }

        /* Product View Modal */
        .product-view-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            padding: var(--spacing-lg);
        }

        .product-view-modal.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            cursor: pointer;
        }

        .modal-content {
            position: relative;
            background: var(--color-secondary);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            max-height: 90vh;
            width: 100%;
            max-width: 700px;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--spacing-lg) var(--spacing-xl);
            border-bottom: 1px solid var(--color-border);
            flex-shrink: 0;
            min-height: 56px;
        }

        .modal-close-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--color-gray);
            padding: var(--spacing-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
            min-height: 40px;
            border-radius: var(--radius-md);
            transition: var(--transition);
            order: -1;
        }

        .modal-close-btn:hover {
            background: var(--color-light-gray);
            color: var(--color-primary);
        }

        .modal-title {
            font-size: 18px;
            font-weight: var(--font-weight-bold);
            color: var(--color-primary);
            margin: 0;
            flex: 1;
            text-align: center;
        }

        .modal-edit-btn {
            background: var(--color-accent);
            color: var(--color-primary);
            border: none;
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: var(--radius-md);
            font-weight: var(--font-weight-semibold);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            min-height: 40px;
            transition: var(--transition);
        }

        .modal-edit-btn:hover {
            background: #d4891b;
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-xl);
        }

        .modal-details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--spacing-xl);
        }

        .modal-detail-row {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
            padding-bottom: var(--spacing-lg);
            border-bottom: 1px solid var(--color-border);
        }

        .modal-detail-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .modal-detail-row label {
            font-size: 11px;
            font-weight: var(--font-weight-semibold);
            color: var(--color-gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal-detail-row > div:not(.modal-product-image) {
            font-size: 14px;
            font-weight: var(--font-weight-medium);
            color: var(--color-primary);
            word-break: break-word;
        }

        .modal-product-image {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-light-gray);
            border-radius: var(--radius-md);
            min-height: 200px;
        }

        .modal-product-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
            border-radius: var(--radius-md);
        }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: 6px var(--spacing-md);
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: var(--font-weight-semibold);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge.active {
            background: rgba(46, 204, 64, 0.1);
            color: var(--color-success);
        }

        .status-badge.inactive {
            background: rgba(255, 65, 54, 0.1);
            color: var(--color-danger);
        }

        .status-badge.low-stock {
            background: rgba(255, 133, 27, 0.1);
            color: var(--color-warning);
        }

        .status-badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        /* Action Buttons */
        .product-actions {
            display: flex;
            gap: var(--spacing-sm);
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: var(--spacing-sm);
            border-radius: var(--radius-md);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 36px;
            min-height: 36px;
            color: var(--color-gray);
        }

        .action-btn:hover {
            color: var(--color-accent);
            background: var(--color-light-gray);
        }

        .action-btn.delete:hover {
            color: var(--color-danger);
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-3xl) var(--spacing-xl);
            color: var(--color-gray);
            gap: var(--spacing-lg);
        }

        .empty-state-icon {
            font-size: 48px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 14px;
            font-weight: var(--font-weight-medium);
        }

        /* Loading State */
        .loading-skeleton {
            animation: loading 1.5s infinite;
            background: linear-gradient(90deg, var(--color-light-gray) 25%, var(--color-bg) 50%, var(--color-light-gray) 75%);
            background-size: 200% 100%;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .table-row-loading {
            opacity: 0.6;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: var(--spacing-md);
            margin-top: var(--spacing-xl);
            padding-top: var(--spacing-xl);
            border-top: 1px solid var(--color-border);
        }

        .pagination-btn {
            background: var(--color-secondary);
            border: 1px solid var(--color-border);
            color: var(--color-primary);
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            cursor: pointer;
            min-width: 40px;
            min-height: 40px;
            transition: var(--transition);
            font-weight: var(--font-weight-semibold);
        }

        .pagination-btn:hover:not(:disabled) {
            background: var(--color-accent);
            border-color: var(--color-accent);
            color: var(--color-primary);
        }

        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination-btn.active {
            background: var(--color-accent);
            border-color: var(--color-accent);
            color: var(--color-primary);
        }

        .pagination-info {
            font-size: 13px;
            color: var(--color-gray);
        }

        /* Mobile Responsive */
        @media (max-width: 767px) {
            .products-wrapper {
                flex-direction: column;
            }

            .products-sidebar {
                position: fixed;
                top: 0;
                left: -100%;
                width: 100%;
                height: 100vh;
                transition: left 0.3s ease;
                z-index: 100;
            }

            .products-sidebar.active {
                left: 0;
            }

            .products-main {
                margin-left: 0;
                height: 100vh;
            }

            .products-menu-btn {
                display: flex;
            }

            .products-header {
                order: -1;
            }

            .products-content {
                padding: var(--spacing-lg);
            }

            .filters-bar {
                flex-direction: column;
                gap: var(--spacing-md);
            }

            .filter-group {
                width: 100%;
                flex: none;
            }

            .filter-input,
            .filter-select {
                width: 100%;
            }

            .filter-actions {
                width: 100%;
                justify-content: stretch;
            }

            .btn-filter-clear {
                flex: 1;
            }

            .products-table-wrapper {
                border: none;
            }

            .products-table thead {
                display: none;
            }

            .products-table tbody {
                display: block;
            }

            .products-table tbody tr {
                display: block;
                margin-bottom: var(--spacing-lg);
                border: 1px solid var(--color-border);
                border-radius: var(--radius-lg);
                background: var(--color-secondary);
                overflow: hidden;
            }

            .products-table tbody tr:hover {
                border-color: var(--color-accent);
                box-shadow: var(--shadow-sm);
            }

            .products-table td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: var(--spacing-md) var(--spacing-lg);
                border-bottom: 1px solid var(--color-border);
                white-space: normal;
                text-overflow: clip;
                overflow: visible;
            }

            .products-table td:last-child {
                border-bottom: none;
            }

            .products-table td::before {
                content: attr(data-label);
                font-weight: var(--font-weight-semibold);
                color: var(--color-gray);
                text-transform: uppercase;
                font-size: 11px;
                letter-spacing: 0.5px;
            }

            .product-details-row {
                display: none;
            }

            .product-details-row.expanded {
                display: table-row;
            }

            .product-details-cell {
                display: block;
                padding: var(--spacing-lg) !important;
                background: rgba(224, 159, 62, 0.05);
                border-radius: 0 0 var(--radius-lg) var(--radius-lg);
            }

            .product-details-grid {
                grid-template-columns: 1fr;
            }

            .product-detail-item {
                padding-bottom: var(--spacing-md);
                border-bottom: 1px solid var(--color-border);
            }

            .product-detail-item:last-child {
                border-bottom: none;
                padding-bottom: 0;
            }

            .product-actions {
                width: 100%;
                margin-top: var(--spacing-md);
            }

            .action-btn {
                flex: 1;
                min-height: 40px;
                padding: var(--spacing-md);
            }

            .btn-add {
                width: 100%;
                justify-content: center;
            }

            .pagination {
                flex-wrap: wrap;
            }
        }

        /* Tablet Responsive */
        @media (min-width: 768px) and (max-width: 1024px) {
            .products-table th:nth-child(n+5),
            .products-table tbody td:nth-child(n+5) {
                display: none;
            }
        }

        /* Modal Responsive - Mobile */
        @media (max-width: 767px) {
            .product-view-modal {
                padding: var(--spacing-md);
            }

            .modal-content {
                max-width: 100%;
                max-height: 95vh;
            }

            .modal-header {
                flex-wrap: wrap;
                padding: var(--spacing-md) var(--spacing-lg);
            }

            .modal-title {
                order: 0;
                width: 100%;
                margin: 0 0 var(--spacing-md) 0;
                font-size: 16px;
            }

            .modal-close-btn {
                min-width: 36px;
                min-height: 36px;
            }

            .modal-edit-btn {
                flex: 1;
                min-height: 36px;
                font-size: 11px;
                padding: var(--spacing-sm) var(--spacing-md);
            }

            .modal-body {
                padding: var(--spacing-lg);
            }

            .modal-details-grid {
                grid-template-columns: 1fr;
                gap: var(--spacing-lg);
            }

            .modal-detail-row {
                padding-bottom: var(--spacing-md);
            }

            .modal-product-image {
                min-height: 150px;
            }
        }

        /* Modal Responsive - Tablet */
        @media (min-width: 768px) and (max-width: 1024px) {
            .modal-content {
                max-width: 600px;
            }

            .modal-details-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Print Styles */
        @media print {
            .products-sidebar,
            .products-header,
            .products-menu-btn,
            .filters-bar,
            .pagination,
            .product-actions,
            .product-view-modal {
                display: none;
            }

            .products-main {
                margin-left: 0;
            }

            .products-content {
                padding: 0;
            }

            .products-table tbody tr:nth-child(n+2) {
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <div class="products-wrapper">
        <!-- Sidebar -->
        <aside class="products-sidebar" id="productsSidebar">
            <!-- Sidebar Logo -->
            <div class="sidebar-logo-container">
                <div class="sidebar-logo-wrapper">
                    <div class="sidebar-logo-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="3" width="8" height="8" fill="currentColor"/>
                            <rect x="13" y="3" width="8" height="8" fill="currentColor" opacity="0.6"/>
                            <rect x="3" y="13" width="8" height="8" fill="currentColor" opacity="0.6"/>
                            <rect x="13" y="13" width="8" height="8" fill="currentColor" opacity="0.3"/>
                        </svg>
                    </div>
                    <div class="sidebar-logo-text">
                        <span class="main">FJL</span>
                        <span class="tagline">Admin</span>
                    </div>
                </div>
                <button class="sidebar-close-btn" id="sidebarCloseBtn" type="button" title="Close menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <!-- Navigation Menu -->
            <ul class="sidebar-menu">
                <li class="sidebar-menu-item">
                    <a href="/admin/dashboard.html" class="sidebar-menu-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="/admin/products.html" class="sidebar-menu-link active">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                        <span>Products</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="/admin/categories.html" class="sidebar-menu-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                        </svg>
                        <span>Categories</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="/admin/orders.html" class="sidebar-menu-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                        <span>Orders</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="/admin/customers.html" class="sidebar-menu-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        <span>Customers</span>
                    </a>
                </li>

                <li class="sidebar-menu-item sidebar-menu-section">
                    <div class="sidebar-menu-section-title">Settings</div>
                </li>
                <li class="sidebar-menu-item">
                    <a href="/admin/settings.html" class="sidebar-menu-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m3.08 3.08l4.24 4.24M1 12h6m6 0h6m-15.78 7.78l4.24-4.24m3.08-3.08l4.24-4.24"></path>
                        </svg>
                        <span>Settings</span>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <div class="products-main">
            <!-- Header -->
            <header class="products-header">
                <div class="products-header-left">
                    <button class="products-menu-btn" id="productsMenuBtn" title="Toggle menu">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <h1 class="products-title">Products</h1>
                </div>
                <div class="products-header-right">
                    <a href="/admin/product-add.html" class="btn-add">
                        <span>➕</span>
                        <span>Add Product</span>
                    </a>
                </div>
            </header>

            <!-- Content -->
            <main class="products-content">
                <!-- Filters -->
                <div class="filters-bar">
                    <div class="filter-group">
                        <input type="text" id="searchInput" class="filter-input" placeholder="Search by name or SKU...">
                    </div>
                    <div class="filter-group">
                        <select id="categoryFilter" class="filter-select">
                            <option value="">All Categories</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <select id="stockFilter" class="filter-select">
                            <option value="">All Stock Status</option>
                            <option value="in-stock">In Stock</option>
                            <option value="low-stock">Low Stock</option>
                            <option value="out-of-stock">Out of Stock</option>
                        </select>
                    </div>
                    <div class="filter-actions">
                        <button class="btn-filter-clear" id="clearFiltersBtn">Clear Filters</button>
                    </div>
                </div>

                <!-- Table -->
                <div class="products-table-wrapper">
                    <table class="products-table" id="productsTable">
                        <thead>
                            <tr>
                                <th></th>
                                <th>SKU</th>
                                <th>Name</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody">
                            <!-- Products load here -->
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="pagination" id="paginationContainer">
                    <!-- Pagination controls load here -->
                </div>
            </main>
        </div>
    </div>

    <!-- Product View Modal -->
    <div class="product-view-modal" id="productViewModal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="modal-close-btn" id="modalCloseBtn" title="Close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
                <h2 class="modal-title">Product Details</h2>
                <button type="button" class="modal-edit-btn" id="modalEditBtn">Edit</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Product details load here -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api-service.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/icon.js"></script>

    <script>
        // Require authentication
        window.apiUtils?.requireAuth?.();

        // Products Manager
        class ProductsManager {
            constructor() {
                this.products = [];
                this.categories = [];
                this.currentPage = 1;
                this.itemsPerPage = 20;
                this.filters = {
                    search: '',
                    category: '',
                    stock: ''
                };
                this.editingProduct = null;
                this.deletingProductId = null;

                this.init();
            }

            init() {
                this.setupEventListeners();
                this.loadCategories();
                this.loadProducts();
            }

            setupEventListeners() {
                // Modal close button and overlay click to close
                const modal = document.getElementById('productViewModal');
                const modalOverlay = modal?.querySelector('.modal-overlay');
                const modalCloseBtn = document.getElementById('modalCloseBtn');

                modalCloseBtn?.addEventListener('click', () => {
                    this.closeProductModal();
                });

                modalOverlay?.addEventListener('click', () => {
                    this.closeProductModal();
                });

                // Mobile menu
                const menuBtn = document.getElementById('productsMenuBtn');
                const sidebar = document.getElementById('productsSidebar');

                menuBtn?.addEventListener('click', () => {
                    sidebar.classList.toggle('active');
                });

                document.addEventListener('click', (e) => {
                    if (window.innerWidth < 768) {
                        if (!sidebar.contains(e.target) && !menuBtn.contains(e.target)) {
                            sidebar.classList.remove('active');
                        }
                    }
                });

                window.addEventListener('resize', () => {
                    if (window.innerWidth >= 768) {
                        sidebar.classList.remove('active');
                    }
                });

                // Filter events
                document.getElementById('searchInput')?.addEventListener('input', (e) => {
                    this.filters.search = e.target.value;
                    this.currentPage = 1;
                    this.loadProducts();
                });

                document.getElementById('categoryFilter')?.addEventListener('change', (e) => {
                    this.filters.category = e.target.value;
                    this.currentPage = 1;
                    this.loadProducts();
                });

                document.getElementById('stockFilter')?.addEventListener('change', (e) => {
                    this.filters.stock = e.target.value;
                    this.currentPage = 1;
                    this.loadProducts();
                });

                document.getElementById('clearFiltersBtn')?.addEventListener('click', () => {
                    this.filters = { search: '', category: '', stock: '' };
                    document.getElementById('searchInput').value = '';
                    document.getElementById('categoryFilter').value = '';
                    document.getElementById('stockFilter').value = '';
                    this.currentPage = 1;
                    this.loadProducts();
                });

                // Event delegation for action buttons
                document.addEventListener('click', (e) => {
                    if (e.target.closest('.view-btn')) {
                        const productId = e.target.closest('.view-btn').getAttribute('data-product-id');
                        this.viewProduct(productId);
                    }
                    if (e.target.closest('.action-btn.delete')) {
                        const productId = e.target.closest('.action-btn.delete').getAttribute('data-product-id');
                        this.deleteProduct(productId);
                    }
                });

            }

            async loadCategories() {
                try {
                    const response = await window.apiServices?.categoryService?.getCategories?.() || { data: [] };
                    // Handle both wrapped {data: []} and direct array formats
                    this.categories = Array.isArray(response) ? response : (response.data || []);
                    this.populateCategorySelect();
                } catch (error) {
                    console.error('Failed to load categories:', error);
                }
            }

            populateCategorySelect() {
                const selects = document.querySelectorAll('select[name="category"]');
                const categoryFilter = document.getElementById('categoryFilter');

                selects.forEach(select => {
                    select.innerHTML = '<option value="">Select Category</option>' +
                        this.categories.map(cat => `<option value="${cat.id}">${cat.name}</option>`).join('');
                });

                if (categoryFilter) {
                    categoryFilter.innerHTML = '<option value="">All Categories</option>' +
                        this.categories.map(cat => `<option value="${cat.id}">${cat.name}</option>`).join('');
                }
            }

            async loadProducts() {
                try {
                    this.showTableLoading();
                    const filters = {};
                    if (this.filters.search) filters.search = this.filters.search;
                    if (this.filters.category) filters.category = this.filters.category;
                    if (this.filters.stock) filters.stock = this.filters.stock;
                    filters.page = this.currentPage;
                    filters.limit = this.itemsPerPage;

                    const response = await window.apiServices?.productService?.getProducts?.(filters) || { data: [], total: 0 };

                    // Handle both response formats: {data: []} and {products: []}
                    this.products = Array.isArray(response) ? response : (response.data || response.products || []);

                    console.log('Products loaded:', this.products.length, this.products);
                    this.renderProducts();
                    this.renderPagination(response.total || response.count || this.products.length);
                } catch (error) {
                    console.error('Failed to load products:', error);
                    this.showTableError('Failed to load products');
                }
            }

            showTableLoading() {
                const tbody = document.getElementById('productsTableBody');
                tbody.innerHTML = Array(5)
                    .fill(null)
                    .map(() => `
                        <tr class="table-row-loading">
                            <td><div class="loading-skeleton" style="width: 100%; height: 20px;"></div></td>
                            <td><div class="loading-skeleton" style="width: 100%; height: 20px;"></div></td>
                            <td><div class="loading-skeleton" style="width: 100%; height: 20px;"></div></td>
                            <td><div class="loading-skeleton" style="width: 100%; height: 20px;"></div></td>
                            <td><div class="loading-skeleton" style="width: 100%; height: 20px;"></div></td>
                            <td><div class="loading-skeleton" style="width: 100%; height: 20px;"></div></td>
                            <td><div class="loading-skeleton" style="width: 100%; height: 20px;"></div></td>
                        </tr>
                    `)
                    .join('');
            }

            renderProducts() {
                const tbody = document.getElementById('productsTableBody');

                if (this.products.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="7">
                                <div class="empty-state">
                                    <div class="empty-state-icon">📦</div>
                                    <div class="empty-state-text">No products found</div>
                                </div>
                            </td>
                        </tr>
                    `;
                    return;
                }

                const { numberUtils, dateUtils } = window.adminUtils;
                tbody.innerHTML = this.products
                    .map((product, idx) => this.createProductRow(product, idx))
                    .join('');
            }

            createProductRow(product, idx) {
                const { numberUtils } = window.adminUtils;
                // API returns stock as 'total_stock'
                const stock = product.total_stock || product.stock || product.quantity || product.inventory || 0;
                const stockStatus = stock > 10 ? 'in-stock' : stock > 0 ? 'low-stock' : 'out-of-stock';
                const statusLabel = stockStatus === 'in-stock' ? 'In Stock' : stockStatus === 'low-stock' ? 'Low Stock' : 'Out of Stock';

                return `
                    <tr>
                        <td data-label="SKU" style="font-family: monospace; font-size: 13px;">${product.sku || 'N/A'}</td>
                        <td data-label="Name" style="font-weight: var(--font-weight-semibold);">${this.truncate(product.name, 30)}</td>
                        <td data-label="Price">${numberUtils.formatCurrency(product.price)}</td>
                        <td data-label="Stock">${stock} units</td>
                        <td data-label="Status">
                            <span class="status-badge ${product.is_active ? 'active' : 'inactive'}">
                                <span class="status-badge-dot"></span>
                                ${product.is_active ? 'Active' : 'Inactive'}
                            </span>
                        </td>
                        <td data-label="Actions">
                            <div class="product-actions">
                                <button class="action-btn view-btn" data-product-id="${product.id}" title="View & Edit">✏️</button>
                                <button class="action-btn delete" data-product-id="${product.id}" title="Delete">🗑️</button>
                            </div>
                        </td>
                    </tr>
                `;
            }

            getCategoryName(categoryId) {
                if (!categoryId) return 'Uncategorized';
                const category = this.categories.find(c => c.id === categoryId);
                return category?.name || 'Unknown';
            }

            truncate(str, length) {
                if (!str) return '';
                return str.length > length ? str.substring(0, length) + '...' : str;
            }

            viewProduct(productId) {
                // Open modal with product details
                const product = this.products.find(p => p.id === productId);
                if (product) {
                    this.populateProductModal(product);
                    this.openProductModal();
                }
            }

            openProductModal() {
                const modal = document.getElementById('productViewModal');
                if (modal) {
                    modal.classList.add('active');
                    document.body.style.overflow = 'hidden';
                }
            }

            closeProductModal() {
                const modal = document.getElementById('productViewModal');
                if (modal) {
                    modal.classList.remove('active');
                    document.body.style.overflow = 'auto';
                }
            }

            populateProductModal(product) {
                const { numberUtils } = window.adminUtils;
                const stock = product.total_stock || product.stock || product.quantity || product.inventory || 0;
                const stockStatus = stock > 10 ? 'in-stock' : stock > 0 ? 'low-stock' : 'out-of-stock';
                const statusLabel = stockStatus === 'in-stock' ? 'In Stock' : stockStatus === 'low-stock' ? 'Low Stock' : 'Out of Stock';

                // Set product ID for Edit button
                const editBtn = document.getElementById('modalEditBtn');
                if (editBtn) {
                    editBtn.removeEventListener('click', editBtn._editHandler);
                    editBtn._editHandler = () => {
                        window.location.href = `/admin/product-edit.html?id=${product.id}`;
                    };
                    editBtn.addEventListener('click', editBtn._editHandler);
                }

                // Populate modal content
                const modalBody = document.getElementById('modalBody');
                if (modalBody) {
                    modalBody.innerHTML = `
                        <div class="modal-details-grid">
                            <div class="modal-detail-row">
                                <label>Image</label>
                                <div class="modal-product-image">
                                    ${product.image_url ? `<img src="${product.image_url}" alt="${product.name}" style="max-width: 200px; max-height: 200px; object-fit: cover;">` : '<div style="width: 200px; height: 200px; display: flex; align-items: center; justify-content: center; background: #f0f0f0;">No image</div>'}
                                </div>
                            </div>
                            <div class="modal-detail-row">
                                <label>SKU</label>
                                <div>${product.sku || 'N/A'}</div>
                            </div>
                            <div class="modal-detail-row">
                                <label>Category</label>
                                <div>${this.getCategoryName(product.category_id)}</div>
                            </div>
                            <div class="modal-detail-row">
                                <label>Price</label>
                                <div>${numberUtils.formatCurrency(product.price)}</div>
                            </div>
                            <div class="modal-detail-row">
                                <label>Stock</label>
                                <div>${stock} units</div>
                            </div>
                            <div class="modal-detail-row">
                                <label>Stock Status</label>
                                <div>${statusLabel}</div>
                            </div>
                            <div class="modal-detail-row">
                                <label>Status</label>
                                <div>${product.is_active ? 'Active' : 'Inactive'}</div>
                            </div>
                            <div class="modal-detail-row">
                                <label>Description</label>
                                <div>${product.description || 'No description'}</div>
                            </div>
                        </div>
                    `;
                }
            }

            deleteProduct(productId) {
                // Direct delete (no modal confirmation)
                this.performDelete(productId);
            }

            async performDelete(productId) {
                if (!confirm('Are you sure you want to delete this product? This action cannot be undone.')) {
                    return;
                }

                try {
                    await window.apiServices?.productService?.deleteProduct?.(productId);
                    alert('Product deleted successfully');
                    this.loadProducts();
                } catch (error) {
                    alert(`Error: ${error.message}`);
                }
            }

            renderPagination(total) {
                const pages = Math.ceil(total / this.itemsPerPage);
                const container = document.getElementById('paginationContainer');

                if (pages <= 1) {
                    container.innerHTML = '';
                    return;
                }

                let html = `<button class="pagination-btn" ${this.currentPage === 1 ? 'disabled' : ''} data-action="prev">← Previous</button>`;

                for (let i = 1; i <= pages; i++) {
                    if (i === 1 || i === pages || (i >= this.currentPage - 1 && i <= this.currentPage + 1)) {
                        html += `<button class="pagination-btn ${i === this.currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
                    } else if (i === 2 || i === pages - 1) {
                        html += '<span class="pagination-info">...</span>';
                    }
                }

                html += `<button class="pagination-btn" ${this.currentPage === pages ? 'disabled' : ''} data-action="next">Next →</button>`;
                html += `<span class="pagination-info">${this.currentPage} of ${pages}</span>`;

                container.innerHTML = html;

                // Add event listeners to pagination buttons
                this.attachPaginationListeners();
            }

            previousPage() {
                if (this.currentPage > 1) {
                    this.currentPage--;
                    this.loadProducts();
                }
            }

            nextPage() {
                const pages = Math.ceil(this.products.length / this.itemsPerPage);
                if (this.currentPage < pages) {
                    this.currentPage++;
                    this.loadProducts();
                }
            }

            goToPage(page) {
                this.currentPage = page;
                this.loadProducts();
            }

            attachPaginationListeners() {
                const container = document.getElementById('paginationContainer');
                if (!container) return;

                // Previous button
                const prevBtn = container.querySelector('[data-action="prev"]');
                prevBtn?.addEventListener('click', () => this.previousPage());

                // Page number buttons
                const pageButtons = container.querySelectorAll('[data-page]');
                pageButtons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const page = parseInt(btn.getAttribute('data-page'));
                        this.goToPage(page);
                    });
                });

                // Next button
                const nextBtn = container.querySelector('[data-action="next"]');
                nextBtn?.addEventListener('click', () => this.nextPage());
            }

            showTableError(message) {
                const tbody = document.getElementById('productsTableBody');
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7">
                            <div class="empty-state">
                                <div class="empty-state-text">⚠️ ${message}</div>
                            </div>
                        </td>
                    </tr>
                `;
            }
        }


        // Initialize
        let productsManager;
        document.addEventListener('DOMContentLoaded', () => {
            productsManager = new ProductsManager();

            // Close sidebar with close button
            const sidebarCloseBtn = document.getElementById('sidebarCloseBtn');
            sidebarCloseBtn?.addEventListener('click', () => {
                const sidebar = document.querySelector('.products-sidebar');
                if (sidebar) {
                    sidebar.classList.remove('open', 'active');
                }
            });

            // Re-render Lucide icons after DOM is ready
            if (window.lucide) {
                lucide.createIcons();
            }
        });
    </script>
</body>
