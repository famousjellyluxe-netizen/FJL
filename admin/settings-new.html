<!--
  FJL Admin Panel - Settings Page
  Mobile-first responsive settings management
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - FJL Admin</title>
    <link rel="icon" type="image/svg+xml" href="/fjl-logo-favicon.svg">

    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="design-tokens.css">
    <link rel="stylesheet" href="styles.css">

    <style>
        .settings-wrapper { display: flex; height: 100vh; background: var(--color-bg); }
        .settings-sidebar { width: var(--sidebar-width); background: var(--color-primary); color: var(--color-secondary); overflow-y: auto; position: fixed; height: 100vh; z-index: var(--z-menu); }
        .settings-main { flex: 1; margin-left: var(--sidebar-width); display: flex; flex-direction: column; overflow: hidden; }
        .settings-header { background: var(--color-secondary); border-bottom: 1px solid var(--color-border); padding: var(--spacing-lg) var(--spacing-xl); display: flex; justify-content: space-between; align-items: center; height: var(--header-height); box-shadow: var(--shadow-sm); }
        .settings-header-left { display: flex; align-items: center; gap: var(--spacing-lg); flex: 1; }
        .settings-menu-btn { display: none; background: none; border: none; cursor: pointer; color: var(--color-primary); font-size: 24px; padding: var(--spacing-md); min-width: var(--touch-target-min); min-height: var(--touch-target-min); border-radius: var(--radius-md); transition: var(--transition); }
        .settings-menu-btn:hover { background: var(--color-light-gray); }
        .settings-title { font-size: clamp(18px, 5vw, 24px); font-weight: var(--font-weight-bold); font-family: var(--font-heading); color: var(--color-primary); }
        .settings-content { flex: 1; overflow-y: auto; padding: var(--spacing-xl); }

        .settings-section { background: var(--color-secondary); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--spacing-xl); margin-bottom: var(--spacing-xl); }
        .settings-section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-xl); padding-bottom: var(--spacing-lg); border-bottom: 1px solid var(--color-border); }
        .settings-section-title { font-size: 18px; font-weight: var(--font-weight-bold); font-family: var(--font-heading); color: var(--color-primary); }
        .settings-section-subtitle { font-size: 13px; color: var(--color-gray); }

        .form-group { display: flex; flex-direction: column; gap: var(--spacing-sm); margin-bottom: var(--spacing-lg); }
        .form-label { font-weight: var(--font-weight-semibold); color: var(--color-primary); font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-input { padding: var(--spacing-md) var(--spacing-lg); border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: 14px; font-family: var(--font-body); background: var(--color-light-gray); color: var(--color-primary); min-height: 40px; }
        .form-input:focus { outline: none; border-color: var(--color-accent); background: var(--color-secondary); box-shadow: 0 0 0 3px rgba(224, 159, 62, 0.1); }

        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--spacing-lg); }

        .btn-save { background: var(--color-accent); color: var(--color-primary); padding: var(--spacing-md) var(--spacing-lg); border: none; border-radius: var(--radius-md); font-weight: var(--font-weight-semibold); cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; font-size: 12px; min-height: 40px; transition: var(--transition); }
        .btn-save:hover { background: #d4891b; }

        .status-message { padding: var(--spacing-md) var(--spacing-lg); border-radius: var(--radius-md); margin-bottom: var(--spacing-lg); display: none; }
        .status-message.success { background: rgba(46, 204, 64, 0.1); color: var(--color-success); display: block; }
        .status-message.error { background: rgba(255, 65, 54, 0.1); color: var(--color-danger); display: block; }

        .collapsible-btn { background: none; border: none; color: var(--color-accent); cursor: pointer; font-size: 16px; padding: 0; text-decoration: underline; }

        .password-strength { height: 4px; background: var(--color-light-gray); border-radius: 2px; margin-top: var(--spacing-sm); overflow: hidden; }
        .password-strength-bar { height: 100%; background: var(--color-danger); transition: all 0.3s ease; }
        .password-strength-bar.medium { background: var(--color-warning); width: 66%; }
        .password-strength-bar.strong { background: var(--color-success); width: 100%; }

        .info-box { background: var(--color-light-gray); border-left: 4px solid var(--color-accent); padding: var(--spacing-lg); border-radius: var(--radius-md); margin-bottom: var(--spacing-lg); }
        .info-box-label { font-size: 12px; color: var(--color-gray); text-transform: uppercase; margin-bottom: 4px; }
        .info-box-value { font-size: 16px; font-weight: var(--font-weight-semibold); color: var(--color-primary); }

        @media (max-width: 767px) {
            .settings-wrapper { flex-direction: column; }
            .settings-sidebar { position: fixed; top: 0; left: -100%; width: 100%; height: 100vh; transition: left 0.3s ease; z-index: 100; }
            .settings-sidebar.active { left: 0; }
            .settings-main { margin-left: 0; height: 100vh; }
            .settings-menu-btn { display: flex; }
            .settings-header { order: -1; }
            .settings-content { padding: var(--spacing-lg); }
            .settings-section { padding: var(--spacing-lg); }
            .form-row { grid-template-columns: 1fr; }
            .btn-save { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="settings-wrapper">
        <aside class="settings-sidebar" id="settingsSidebar"></aside>

        <div class="settings-main">
            <header class="settings-header">
                <div class="settings-header-left">
                    <button class="settings-menu-btn" id="settingsMenuBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </button>
                    <h1 class="settings-title">Settings</h1>
                </div>
            </header>

            <main class="settings-content">
                <!-- Store Information -->
                <div class="settings-section">
                    <div class="settings-section-header">
                        <div>
                            <h2 class="settings-section-title">Store Information</h2>
                            <div class="settings-section-subtitle">Manage your store details</div>
                        </div>
                    </div>

                    <form id="storeForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Store Name</label>
                                <input type="text" name="store_name" class="form-input" placeholder="Famous Jelly Luxe" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Business Name</label>
                                <input type="text" name="business_name" class="form-input" placeholder="Business Name" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-input" placeholder="hello@fjlclothing.shop" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Phone</label>
                                <input type="tel" name="phone" class="form-input" placeholder="+234 800 000 0000">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Address</label>
                            <input type="text" name="address" class="form-input" placeholder="Store address">
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Tax Rate (%)</label>
                                <input type="number" name="tax_rate" class="form-input" placeholder="0" step="0.01" min="0">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Shipping Cost (₦)</label>
                                <input type="number" name="shipping_cost" class="form-input" placeholder="0" step="0.01" min="0">
                            </div>
                        </div>

                        <div id="storeMessage" class="status-message"></div>
                        <button type="button" class="btn-save" onclick="settingsManager.saveStore()">Save Store Settings</button>
                    </form>
                </div>

                <!-- Account Security -->
                <div class="settings-section">
                    <div class="settings-section-header">
                        <div>
                            <h2 class="settings-section-title">Account Security</h2>
                            <div class="settings-section-subtitle">Manage your password</div>
                        </div>
                    </div>

                    <form id="passwordForm">
                        <div class="form-group">
                            <label class="form-label">Current Password</label>
                            <input type="password" name="current_password" class="form-input" placeholder="Enter current password" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">New Password</label>
                            <input type="password" name="new_password" class="form-input" placeholder="Enter new password" id="newPassword" required>
                            <div class="password-strength">
                                <div class="password-strength-bar" id="strengthBar"></div>
                            </div>
                            <small style="color: var(--color-gray); font-size: 12px;">At least 8 characters with uppercase, lowercase, and numbers</small>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" name="confirm_password" class="form-input" placeholder="Confirm new password" required>
                        </div>

                        <div id="passwordMessage" class="status-message"></div>
                        <button type="button" class="btn-save" onclick="settingsManager.changePassword()">Update Password</button>
                    </form>
                </div>

                <!-- System Information -->
                <div class="settings-section">
                    <div class="settings-section-header">
                        <h2 class="settings-section-title">System Information</h2>
                    </div>

                    <div id="systemInfo">
                        <div class="info-box">
                            <div class="info-box-label">Total Products</div>
                            <div class="info-box-value" id="totalProducts">Loading...</div>
                        </div>
                        <div class="info-box">
                            <div class="info-box-label">Total Orders</div>
                            <div class="info-box-value" id="totalOrders">Loading...</div>
                        </div>
                        <div class="info-box">
                            <div class="info-box-label">Total Customers</div>
                            <div class="info-box-value" id="totalCustomers">Loading...</div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/api-service.js"></script>
    <script src="js/utils.js"></script>

    <script>
        window.apiUtils?.requireAuth?.();

        class SettingsManager {
            constructor() {
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.loadSettings();
                this.loadSystemInfo();
            }

            setupEventListeners() {
                const menuBtn = document.getElementById('settingsMenuBtn');
                const sidebar = document.getElementById('settingsSidebar');

                menuBtn?.addEventListener('click', () => sidebar.classList.toggle('active'));
                document.addEventListener('click', (e) => {
                    if (window.innerWidth < 768 && !sidebar.contains(e.target) && !menuBtn.contains(e.target)) {
                        sidebar.classList.remove('active');
                    }
                });
                window.addEventListener('resize', () => {
                    if (window.innerWidth >= 768) sidebar.classList.remove('active');
                });

                document.getElementById('newPassword')?.addEventListener('input', (e) => {
                    this.checkPasswordStrength(e.target.value);
                });
            }

            async loadSettings() {
                try {
                    const settings = await window.apiServices?.settingsService?.getStoreSettings?.();
                    if (settings) {
                        document.getElementById('storeForm').elements['store_name'].value = settings.store_name || '';
                        document.getElementById('storeForm').elements['business_name'].value = settings.business_name || '';
                        document.getElementById('storeForm').elements['email'].value = settings.email || '';
                        document.getElementById('storeForm').elements['phone'].value = settings.phone || '';
                        document.getElementById('storeForm').elements['address'].value = settings.address || '';
                        document.getElementById('storeForm').elements['tax_rate'].value = settings.tax_rate || 0;
                        document.getElementById('storeForm').elements['shipping_cost'].value = settings.shipping_cost || 0;
                    }
                } catch (error) {
                    console.error('Failed to load settings:', error);
                }
            }

            async loadSystemInfo() {
                try {
                    const info = await window.apiServices?.settingsService?.getSystemInfo?.();
                    if (info) {
                        const { numberUtils } = window.adminUtils;
                        document.getElementById('totalProducts').textContent = numberUtils.formatCompact(info.total_products || 0);
                        document.getElementById('totalOrders').textContent = numberUtils.formatCompact(info.total_orders || 0);
                        document.getElementById('totalCustomers').textContent = numberUtils.formatCompact(info.total_customers || 0);
                    }
                } catch (error) {
                    console.error('Failed to load system info:', error);
                }
            }

            checkPasswordStrength(password) {
                const bar = document.getElementById('strengthBar');
                let strength = 0;

                if (password.length >= 8) strength += 1;
                if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength += 1;
                if (/\d/.test(password)) strength += 1;

                bar.style.width = (strength * 33) + '%';
                bar.className = 'password-strength-bar';
                if (strength >= 2) bar.classList.add('medium');
                if (strength >= 3) bar.classList.add('strong');
            }

            async saveStore() {
                try {
                    const form = document.getElementById('storeForm');
                    const data = Object.fromEntries(new FormData(form));
                    await window.apiServices?.settingsService?.updateStoreSettings?.(data);
                    this.showMessage('storeMessage', 'Store settings saved successfully!', 'success');
                } catch (error) {
                    this.showMessage('storeMessage', 'Error: ' + error.message, 'error');
                }
            }

            async changePassword() {
                try {
                    const form = document.getElementById('passwordForm');
                    const current = form.elements['current_password'].value;
                    const newPass = form.elements['new_password'].value;
                    const confirm = form.elements['confirm_password'].value;

                    if (newPass !== confirm) {
                        this.showMessage('passwordMessage', 'Passwords do not match', 'error');
                        return;
                    }

                    if (newPass.length < 8) {
                        this.showMessage('passwordMessage', 'Password must be at least 8 characters', 'error');
                        return;
                    }

                    await window.apiServices?.settingsService?.changePassword?.(current, newPass);
                    this.showMessage('passwordMessage', 'Password changed successfully!', 'success');
                    form.reset();
                } catch (error) {
                    this.showMessage('passwordMessage', 'Error: ' + error.message, 'error');
                }
            }

            showMessage(elementId, message, type) {
                const el = document.getElementById(elementId);
                el.textContent = message;
                el.className = 'status-message ' + type;
                setTimeout(() => {
                    el.className = 'status-message';
                }, 5000);
            }
        }

        let settingsManager;
        document.addEventListener('DOMContentLoaded', () => {
            settingsManager = new SettingsManager();
        });
    </script>
</body>
</html>
